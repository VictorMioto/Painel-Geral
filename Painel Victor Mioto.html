<!DOCTYPE html>
<html lang="pt-BR" data-theme="farol">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Victor Mioto</title>
<style>
/* ============================================================
   PAINEL VICTOR MIOTO · v2 · Julho/2026
   3 paletas: farol (escura) · sol (clara quente) · pista (clara fria)
   Cores semânticas por tipo de informação:
   --c-ganho (ganhos) · --c-custo (gastos) · --c-liq (líquido)
   --c-meta (metas) · --c-corr (corridas/km) · --c-alerta
   ============================================================ */
:root{
  --radius:16px; --radius-sm:10px;
  --font-num:'Segoe UI', system-ui, sans-serif;
}
[data-theme="farol"]{
  --bg:#12151d; --bg2:#1a1f2b; --surface:#222838; --surface2:#2a3145;
  --txt:#eef1f8; --txt2:#98a2b8; --border:#323a52;
  --c-ganho:#4ade80; --c-ganho-bg:#14351f; --c-ganho-t:#a7f3c4;
  --c-custo:#fbbf24; --c-custo-bg:#3a2c0a; --c-custo-t:#fde68a;
  --c-liq:#38bdf8; --c-liq-bg:#0c2c3d; --c-liq-t:#bae6fd;
  --c-meta:#a78bfa; --c-meta-bg:#2a1f47; --c-meta-t:#ddd6fe;
  --c-corr:#22d3ee; --c-corr-bg:#0b3038; --c-corr-t:#a5f3fc;
  --c-alerta:#fb7185; --c-alerta-bg:#3d1420; --c-alerta-t:#fecdd3;
  --shadow:0 4px 14px rgba(0,0,0,.35);
}
[data-theme="sol"]{
  --bg:#faf3e3; --bg2:#f3e9d2; --surface:#fffdf7; --surface2:#fbf5e6;
  --txt:#33302a; --txt2:#7d7666; --border:#e5dcc5;
  --c-ganho:#1a9e50; --c-ganho-bg:#d9f5e1; --c-ganho-t:#0d6b33;
  --c-custo:#d97706; --c-custo-bg:#feedcd; --c-custo-t:#92500a;
  --c-liq:#0e7dc2; --c-liq-bg:#d9eefc; --c-liq-t:#085a8f;
  --c-meta:#7c3aed; --c-meta-bg:#ece2fd; --c-meta-t:#5b21b6;
  --c-corr:#0d9498; --c-corr-bg:#d3f4f5; --c-corr-t:#0a6b6e;
  --c-alerta:#dc2646; --c-alerta-bg:#fde0e5; --c-alerta-t:#a3122d;
  --shadow:0 3px 10px rgba(120,90,20,.12);
}
[data-theme="pista"]{
  --bg:#eef2f7; --bg2:#e4eaf2; --surface:#ffffff; --surface2:#f5f8fc;
  --txt:#1c2433; --txt2:#64708a; --border:#dbe2ee;
  --c-ganho:#059669; --c-ganho-bg:#d7f5ea; --c-ganho-t:#065f46;
  --c-custo:#e1583e; --c-custo-bg:#fde5df; --c-custo-t:#9a3521;
  --c-liq:#2563eb; --c-liq-bg:#dde8fe; --c-liq-t:#1e42af;
  --c-meta:#9333ea; --c-meta-bg:#f0e2fd; --c-meta-t:#6b21a8;
  --c-corr:#0891b2; --c-corr-bg:#d5f1f8; --c-corr-t:#155e75;
  --c-alerta:#e11d48; --c-alerta-bg:#fdd9e1; --c-alerta-t:#9f1239;
  --shadow:0 3px 10px rgba(30,50,90,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  min-height:100vh; font-size:15px; transition:background .25s,color .25s;
}
/* ---------- LAYOUT: sidebar + conteúdo ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:216px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);
  padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;
}
.logo{padding:4px 10px 18px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.logo small{display:block;font-weight:500;font-size:11px;color:var(--txt2);letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
.nav-btn{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:none;border-radius:var(--radius-sm);
  background:transparent;color:var(--txt2);font-size:14px;font-weight:600;cursor:pointer;text-align:left;transition:.15s;
}
.nav-btn:hover{background:var(--surface);color:var(--txt)}
.nav-btn.on{background:var(--surface);color:var(--txt);box-shadow:var(--shadow)}
.nav-btn .ico{font-size:17px;width:22px;text-align:center}
.nav-btn .soon{margin-left:auto;font-size:9px;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--txt2);padding:2px 6px;border-radius:20px;letter-spacing:.4px}
.sidebar .foot{margin-top:auto;padding:10px;font-size:11px;color:var(--txt2)}
main{flex:1;padding:26px clamp(14px,3vw,36px);max-width:1180px;width:100%;margin:0 auto}
h1{font-size:22px;letter-spacing:-.4px;margin-bottom:2px}
.sub{color:var(--txt2);font-size:13px;margin-bottom:20px}
/* ---------- SUB-ABAS ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:8px 14px;border-radius:24px;border:1px solid var(--border);background:var(--surface);color:var(--txt2);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.tab.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
/* ---------- CARDS ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi{border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border:1px solid transparent}
.kpi .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;opacity:.85}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .det{font-size:12px;opacity:.8}
.kpi.ganho{background:var(--c-ganho-bg);color:var(--c-ganho-t);border-color:var(--c-ganho)}
.kpi.custo{background:var(--c-custo-bg);color:var(--c-custo-t);border-color:var(--c-custo)}
.kpi.liq{background:var(--c-liq-bg);color:var(--c-liq-t);border-color:var(--c-liq)}
.kpi.meta{background:var(--c-meta-bg);color:var(--c-meta-t);border-color:var(--c-meta)}
.kpi.corr{background:var(--c-corr-bg);color:var(--c-corr-t);border-color:var(--c-corr)}
.kpi.alerta{background:var(--c-alerta-bg);color:var(--c-alerta-t);border-color:var(--c-alerta)}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.ganho{background:var(--c-ganho)} .dot.custo{background:var(--c-custo)} .dot.liq{background:var(--c-liq)}
.dot.meta{background:var(--c-meta)} .dot.corr{background:var(--c-corr)} .dot.alerta{background:var(--c-alerta)}
/* ---------- FORM ---------- */
label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);display:block;margin-bottom:4px}
input,textarea,select{
  width:100%;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface2);color:var(--txt);font-size:14px;font-family:inherit;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--c-liq);outline-offset:0}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.btn{padding:10px 18px;border:none;border-radius:var(--radius-sm);font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.btn.p{background:var(--c-ganho);color:#fff}
.btn.s{background:var(--surface2);color:var(--txt);border:1px solid var(--border)}
.btn.d{background:var(--c-alerta);color:#fff}
.btn:hover{filter:brightness(1.08)}
/* ---------- TABELA ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);text-align:right;padding:7px 8px;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface2)}
.pos{color:var(--c-ganho);font-weight:600} .neg{color:var(--c-alerta);font-weight:600}
.tbl-wrap{overflow-x:auto}
/* ---------- BARRAS ---------- */
.bars{display:flex;align-items:stretch;gap:4px;height:170px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;height:100%}
.bar .bwrap{flex:1;width:100%;display:flex;align-items:flex-end}
.bar .b{width:100%;border-radius:5px 5px 0 0;min-height:3px;transition:.3s}
.bar .t{font-size:9px;color:var(--txt2);white-space:nowrap;height:14px;margin-top:4px;overflow:visible}
.hbar{margin-bottom:9px}
.hbar .hb-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.hbar .hb-track{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}
.hbar .hb-fill{height:100%;border-radius:6px}
/* ---------- BADGES / INSIGHTS ---------- */
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.insight{border-left:4px solid;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;background:var(--surface2);font-size:13.5px;line-height:1.5}
.insight b{display:block;margin-bottom:2px}
.insight.i-pos{border-color:var(--c-ganho)} .insight.i-neg{border-color:var(--c-alerta)}
.insight.i-dica{border-color:var(--c-liq)} .insight.i-neutro{border-color:var(--c-meta)}
.mini{font-size:12px;color:var(--txt2)}
.sep{height:1px;background:var(--border);margin:14px 0}
.theme-opt{display:flex;gap:10px;align-items:center;padding:12px;border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;margin-bottom:10px;background:var(--surface2)}
.theme-opt.on{border-color:var(--c-liq)}
.sw{display:flex;gap:4px}
.sw i{width:18px;height:18px;border-radius:5px;display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;max-width:360px;width:100%;box-shadow:var(--shadow)}
.modal .m-msg{font-size:14px;line-height:1.5;margin-bottom:16px}
.modal .m-btns{display:flex;gap:8px;justify-content:flex-end}
.modal.grande{max-width:700px;max-height:86vh;display:flex;flex-direction:column}
.modal.grande .m-body{overflow-y:auto;padding-right:8px}
.modal.grande .m-body h3{font-size:14px}
.modal.grande .m-body table{margin-bottom:6px;font-size:12.5px}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 20px;border-radius:24px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
.toast.show{opacity:1}
.placeholder{padding:60px 20px;text-align:center;color:var(--txt2)}
.placeholder .big{font-size:40px;margin-bottom:12px}
/* ---------- MOBILE: sidebar vira barra inferior ---------- */
@media(max-width:768px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:fixed;bottom:0;top:auto;left:0;flex-direction:row;padding:6px 8px;z-index:50;border-right:none;border-top:1px solid var(--border);justify-content:space-around}
  .logo,.sidebar .foot{display:none}
  .nav-btn{flex-direction:column;gap:2px;padding:7px 4px;font-size:10px;align-items:center;flex:1}
  .nav-btn .soon{display:none}
  main{padding-bottom:90px}
  .kpi .val{font-size:22px}
}
</style>
</head>

const R$ = v => (v==null||isNaN(v))?'–':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const N1 = v => (v==null||isNaN(v))?'–':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:1});
const hoje = () => new Date().toISOString().slice(0,10);
const fmtD = d => { const [a,m,dd]=d.split('-'); return `${dd}/${m}`; };
const fmtDL = d => { const dt=new Date(d+'T12:00'); return dt.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}); };
function segundaDe(dstr){ const d=new Date(dstr+'T12:00'); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.toISOString().slice(0,10); }
function custoKm(){ return S.config.gas / S.config.consumo; }
function tercasMes(m, ateHoje){
  const [a,mm]=m.split('-').map(Number); const dt=new Date(a,mm-1,1); let n=0;
  const lim = ateHoje && m===hoje().slice(0,7) ? new Date(hoje()+'T12:00') : null;
  while(dt.getMonth()===mm-1){ if(dt.getDay()===2 && (!lim||dt<=lim)) n++; dt.setDate(dt.getDate()+1); }
  return n;
}
function diaCalc(d,v){
  const bruto = v.bruto||0, km = v.km||0;
  const gasto = km * custoKm();
  return { bruto, km, gasto, liq: bruto-gasto,
    rkm: km? bruto/km : null, rh: v.horas? bruto/v.horas : null,
    porFora: (v.dinFisico||0)+(v.pixPJ||0) };
}
function toneRkm(r){ return r==null?'':(r>=3.5?'pos':(r<3?'neg':'')); }

    <div class="mini" style="margin-top:8px">*Líquido do dia = bruto − gasolina consumida (km × ${R$(custoKm())}/km). O aluguel entra no fechamento semanal.</div>
  </div>`;
}


/* ================= ABA: ESTRATÉGIA (tempo real) ================= */
function rEstrategia(){
  const c=document.getElementById('tabc');
  const H=hoje(), segAtual=segundaDe(H), mesAtual=H.slice(0,7);
  const dow=new Date(H+'T12:00').getDay(); // 0=dom
  const nomesDia=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];

  // ---- semana atual ----
  let sw={bruto:0,km:0,gas:0,horas:0,dias:0,sab:null};
  for(const [d,v] of Object.entries(S.dias)){
    if(d<segAtual||d>H) continue;
    sw.bruto+=v.bruto||0; sw.km+=v.km||0; sw.gas+=v.gas||0; sw.horas+=v.horas||0; sw.dias++;
    if(new Date(d+'T12:00').getDay()===6) sw.sab=v;
  }
  const liqSem=sw.bruto-sw.km*custoKm()-S.config.aluguel;
  const metaSem=S.config.meta/4.345;
  // dias úteis restantes da semana (seg-sáb, contando hoje se ainda registrável)
  const diasRest=Math.max(0,6-((dow+6)%7)-1); // até sábado, sem contar hoje
  const ritmoDia=sw.dias?sw.bruto/sw.dias:0;
  const projSem=sw.bruto+ritmoDia*diasRest;
  const faltaMeta=Math.max(0,metaSem-sw.bruto);
  const pSem=Math.min(100,100*sw.bruto/metaSem);

  // ---- mês atual ----
  let mm={bruto:0,km:0,gas:0,dias:0};
  const diasMes=[];
  for(const [d,v] of Object.entries(S.dias)){
    if(d.slice(0,7)!==mesAtual) continue;
    mm.bruto+=v.bruto||0; mm.km+=v.km||0; mm.gas+=v.gas||0; mm.dias++; diasMes.push(d);
  }
  const alqAte=tercasMes(mesAtual,true)*S.config.aluguel;
  const alqTotal=tercasMes(mesAtual,false)*S.config.aluguel;
  const liqMesAte=mm.bruto-mm.gas-alqAte;
  // dias úteis (seg-sáb) restantes no mês
  const [aa,ma]=mesAtual.split('-').map(Number);
  let uteisRest=0; const fim=new Date(aa,ma,0);
  for(let dt=new Date(H+'T12:00');dt<=fim;dt.setDate(dt.getDate()+1)){
    if(dt.toISOString().slice(0,10)===H) continue;
    if(dt.getDay()>=1&&dt.getDay()<=6) uteisRest++;
  }
  const ritmoUtil=mm.dias?mm.bruto/mm.dias:0;
  const gasRatio=mm.bruto?mm.gas/mm.bruto:0.2;
  const projBrutoMes=mm.bruto+ritmoUtil*uteisRest*(5.5/6); // sábado rende ~1/3, fator conservador
  const projLiqMes=projBrutoMes*(1-gasRatio)-alqTotal;

  // ---- réguas da semana ----
  const rkm=sw.km?sw.bruto/sw.km:null;
  const rh=sw.horas?sw.bruto/sw.horas:null;
  const regua=(v,alvo,inv)=>v==null?['–','var(--txt2)']:(inv?v<=alvo:v>=alvo)?['no alvo ✔','var(--c-ganho)']:['abaixo do alvo','var(--c-alerta)'];
  const [rkmTxt,rkmCor]=regua(rkm,3.2);
  const [rhTxt,rhCor]=regua(rh,40);

  // ---- alerta 5 terças ----
  const prox=(()=>{const l=[];for(let k=0;k<6;k++){const dt=new Date(aa,ma-1+k,1);const m=dt.toISOString().slice(0,7);if(tercasMes(m,false)===5)l.push(m);}return l;})();
  const cincoJa=tercasMes(mesAtual,false)===5;

  // ---- plano de hoje (histórico do dia da semana) ----
  const hd=UBER.diaSemana.find(x=>x.d===nomesDia[dow]);
  const mediaDia=hd?hd.v/hd.dias:0;

  // ---- checklist de alavancas ----
  const alav=[
    {t:'Saída às 6h (manhã nobre)',s:'6h–8h paga R$ 0,77–0,79/min — 1 a 2 corridas premium a mais por dia ≈ +R$ 400–500/mês.',
     ok:null, det:'não dá para medir pelo registro — anote nas notas do dia se saiu 6h'},
    {t:'Estender até ~19h (ter/sex)',s:'Hora extra custa só gasolina (~R$ 7) e rende ~R$ 32 líquidos. Alvo: ≥ 9h online em terças e sextas.',
     ok: sw.horas && sw.dias ? (sw.horas/sw.dias)>=8.6 : null, det: sw.dias?('média desta semana: '+N1(sw.horas/sw.dias)+'h/dia'):'sem registros na semana'},
    {t:'Sábado até 12h',s:'Sábado estendido ≈ +R$ 350–400/mês. Alvo: ≥ 5h no sábado.',
     ok: sw.sab? (sw.sab.horas||0)>=5 : (dow<6?null:false), det: sw.sab?('sábado registrado: '+N1(sw.sab.horas)+'h · '+R$(sw.sab.bruto)):'sábado ainda não registrado esta semana'},
    {t:'Régua Corridex: R$/km ≥ 3,20',s:'Aceite pelo R$/min e R$/km, não pelo valor da corrida. Exceção: perto de fechar desafio, aceite borderline.',
     ok: (rkm!=null && rkm>=3.2)? true : null, det: rkm?('R$/km da semana: '+rkm.toFixed(2)):'registre km e bruto para medir'},
    {t:'Reserva para mês de 5 terças',s:'Próximos: '+(prox.length?prox.map(m=>m.slice(5)+'/'+m.slice(0,4)).join(' e '):'nenhum nos próximos 6 meses')+'. Guarde ~R$ 135/semana no mês anterior.',
     ok:null, det: cincoJa?'⚠ ESTE mês tem 5 terças — aluguel total '+R$(alqTotal):'este mês tem '+tercasMes(mesAtual,false)+' terças'},
  ];

  c.innerHTML=`
  <div class="grid g3">
    <div class="kpi ${pSem>=100?'ganho':pSem>=70?'liq':'alerta'}">
      <div class="lbl">Semana vs meta (${R$(metaSem)})</div>
      <div class="val">${pSem.toFixed(0)}%</div>
      <div class="det">${R$(sw.bruto)} bruto em ${sw.dias} dia(s) · ${faltaMeta>0?('faltam '+R$(faltaMeta)+' ≈ '+Math.ceil(faltaMeta/((rh||39.6)))+'h online'):'meta batida ✔'}</div>
    </div>
    <div class="kpi ${projSem>=metaSem?'ganho':'custo'}">
      <div class="lbl">Projeção da semana</div>
      <div class="val">${R$(projSem)}</div>
      <div class="det">ritmo ${R$(ritmoDia)}/dia × ${diasRest} dia(s) restante(s) · líq. parcial ${R$(liqSem)}</div>
    </div>
    <div class="kpi ${projLiqMes>=S.config.meta*0.75?'ganho':'meta'}">
      <div class="lbl">Projeção líquida do mês</div>
      <div class="val">${R$(projLiqMes)}</div>
      <div class="det">até agora: líq. ${R$(liqMesAte)} (${mm.dias} dias) · ${uteisRest} dias úteis restantes</div>
    </div>
  </div>
  <div style="height:14px"></div>
  <div class="grid g2">
    <div class="card">
      <h3><span class="dot liq"></span>Réguas da semana (em tempo real)</h3>
      <div class="hbar"><div class="hb-top"><span>R$/km (alvo ≥ 3,20)</span><span style="color:${rkmCor};font-weight:700">${rkm?rkm.toFixed(2):'–'} · ${rkmTxt}</span></div>
        <div class="hb-track"><div class="hb-fill" style="width:${rkm?Math.min(100,100*rkm/4):0}%;background:${rkmCor}"></div></div></div>
      <div class="hbar"><div class="hb-top"><span>R$/hora online (alvo ≥ 40)</span><span style="color:${rhCor};font-weight:700">${rh?rh.toFixed(2):'–'} · ${rhTxt}</span></div>
        <div class="hb-track"><div class="hb-fill" style="width:${rh?Math.min(100,100*rh/50):0}%;background:${rhCor}"></div></div></div>
      <div class="hbar"><div class="hb-top"><span>Custo da semana (gasolina + aluguel)</span><span>${R$(sw.km*custoKm()+S.config.aluguel)}</span></div>
        <div class="hb-track"><div class="hb-fill" style="width:${sw.bruto?Math.min(100,100*(sw.km*custoKm()+S.config.aluguel)/sw.bruto):0}%;background:var(--c-custo)"></div></div></div>
      <div class="mini">As réguas usam só os dias já registrados desta semana e reagem na hora a cada novo registro.</div>
    </div>
    <div class="card">
      <h3><span class="dot ganho"></span>Plano de hoje · ${nomesDia[dow]}</h3>
      ${dow===0?'<div class="insight i-neutro"><b>Domingo</b>Seu histórico de domingo é fraco (R$ 102/dia em 4 dias trabalhados). Descanso também é estratégia.</div>':
      `<div class="insight i-dica"><b>Média histórica de ${nomesDia[dow]}: ${R$(mediaDia)}/dia</b>${dow===6?'Sábado curto rende R$ 102 — esticando até 12h você pega mais 2–3h do período nobre da manhã.':'Manhã 6h–8h: R$ 0,77–0,79/min (melhor do dia). Tarde 13h–15h: R$ 0,61–0,65/min (evite ociosidade: posicione-se perto de polos comerciais no retorno do almoço).'}</div>
      <div class="insight i-neutro"><b>Meta de hoje para ficar no ritmo</b>Para bater a meta semanal faltam ${R$(faltaMeta)} em ${diasRest+1} dia(s) → alvo de hoje: <b>${R$(faltaMeta/(diasRest+1))}</b>.</div>`}
    </div>
  </div>
  <div style="height:14px"></div>
  <div class="card">
    <h3><span class="dot meta"></span>As 5 alavancas (potencial: +R$ 1.250–1.450/mês líquido)</h3>
    ${alav.map(a=>`<div class="insight ${a.ok===true?'i-pos':a.ok===false?'i-neg':'i-neutro'}"><b>${a.ok===true?'✔ ':a.ok===false?'✖ ':'• '}${a.t}</b>${a.s}<div class="mini" style="margin-top:4px">${a.det}</div></div>`).join('')}
  </div>`;
}

        <option value="">Todos os meses</option>
        ${[...new Set(Object.keys(S.dias).map(d=>d.slice(0,7)))].sort().reverse().map(m=>`<option value="${m}" ${filtroMes===m?'selected':''}>${m.slice(5)}/${m.slice(0,4)}</option>`).join('')}
      </select></h3>
    <div class="tbl-wrap"><table>
      <tr><th>Dia</th><th>KM</th><th>Horas</th><th>Corr.</th><th>Bruto</th><th>💵 Físico</th><th>🏦 PJ</th><th>⛽</th><th>R$/km</th><th></th></tr>
      ${(()=>{
        const entradas=Object.entries(S.dias).filter(([d])=>!filtroMes||d.startsWith(filtroMes)).sort((a,b)=>a[0]<b[0]?1:-1);
        const meses={};
        entradas.forEach(([d,v])=>{const m=d.slice(0,7);(meses[m]=meses[m]||[]).push([d,v]);});
        const nomeMes=m=>{const nm=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];return nm[+m.slice(5,7)-1].toUpperCase()+'/'+m.slice(0,4);};
        return Object.entries(meses).map(([m,lista])=>{
          let tb=0,tk=0,tg=0,tf=0,tq=0,tp=0;
          lista.forEach(([d,v])=>{tb+=v.bruto||0;tk+=v.km||0;tg+=v.gas||0;tf+=v.dinFisico||0;tq+=v.pixQR||0;tp+=v.pixPJ||0;});
          const alq=tercasMes(m,true)*S.config.aluguel;

  </div>`;
  ['f-bruto','f-km'].forEach(id=>document.getElementById(id).addEventListener('input',previewDia));

}
function previewDia(){
  const b=+document.getElementById('f-bruto')?.value||0, km=+document.getElementById('f-km')?.value||0;
  const el=document.getElementById('f-preview'); if(!el)return;
  if(b&&km) el.innerHTML=`Prévia em tempo real: R$/km <b>${(b/km).toFixed(2)}</b> · gasolina consumida <b>${R$(km*custoKm())}</b> · líquido do dia <b>${R$(b-km*custoKm())}</b>`;
  else el.textContent='Preencha bruto e km para ver a prévia do dia.';
}
function num(id){ const v=document.getElementById(id).value; return v===''?null:+v; }
function salvarDia(){
  const d=document.getElementById('f-data').value;
  if(!d){toast('Escolha a data');return;}
  S.dias[d]={ km:num('f-km'),horas:num('f-horas'),corr:num('f-corr'),bruto:num('f-bruto'),
    dinFisico:num('f-fis'),pixQR:(S.dias[d]&&S.dias[d].pixQR)||null,pixPJ:num('f-pj'),gas:num('f-gas'),promo:num('f-promo'),
    notas:document.getElementById('f-notas').value };
  save(); toast('Dia salvo ✔'); render();
}
function carregarDia(){ editarDia(document.getElementById('f-data').value,true); }
function editarDia(d,silent){
  if(tab!=='registro'){tab='registro';render();}
  setTimeout(()=>{
    const v=S.dias[d]||{};
    document.getElementById('f-data').value=d;
    const map={ 'f-km':'km','f-horas':'horas','f-corr':'corr','f-bruto':'bruto','f-fis':'dinFisico','f-pj':'pixPJ','f-gas':'gas','f-promo':'promo' };
    for(const [id,k] of Object.entries(map)) document.getElementById(id).value=v[k]??'';
    document.getElementById('f-notas').value=v.notas||'';
    previewDia();
    if(!silent&&!S.dias[d]) toast('Data sem registro — preencha e salve');
  },0);
}
function apagarDia(d){
  pedirConfirmacao('Apagar o registro de <b>'+fmtDL(d)+'</b>?',
    ()=>{ delete S.dias[d]; S.histDel=S.histDel||[]; if(HIST[d]&&!S.histDel.includes(d))S.histDel.push(d); save(); render(); toast('Dia apagado'); });
}

function atualizaImpacto(){
  const g=+document.getElementById('cfg-gas')?.value||S.config.gas;
  const cs=+document.getElementById('cfg-consumo')?.value||S.config.consumo;
  const al=+document.getElementById('cfg-aluguel')?.value||S.config.aluguel;

function salvarCfg(){
  const g=+document.getElementById('cfg-gas').value;
  if(g && g!==S.config.gas){ S.config.gasHist=S.config.gasHist||[]; S.config.gasHist.push({data:hoje(),preco:g}); }
  S.config.gas=g||S.config.gas;
  S.config.consumo=+document.getElementById('cfg-consumo').value||S.config.consumo;
  S.config.aluguel=+document.getElementById('cfg-aluguel').value||S.config.aluguel;
  S.config.meta=+document.getElementById('cfg-meta').value||S.config.meta;
  save(); toast('Parâmetros salvos ✔'); render();
}
function setTema(t){ S.config.tema=t; document.documentElement.dataset.theme=t; save(); render(); }
function exportar(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='victor-painel-v2-'+hoje()+'.json'; a.click();
}
function importar(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const obj=JSON.parse(r.result);
      const ehAntigo = obj.dias && Object.values(obj.dias).some(v=>'dinheiro' in v && !('dinFisico' in v));
      const novo = ehAntigo ? migrarAntigo(obj) : {...clone(DEF),...obj,config:{...DEF.config,...obj.config}};
      novo.dias = {...S.dias, ...novo.dias};
      S=novo; S.config.tema=S.config.tema||'farol';
      save(); document.documentElement.dataset.theme=S.config.tema;
      toast(ehAntigo?'JSON antigo importado e migrado ✔':'JSON importado ✔'); render();
    }catch(e){ toast('Arquivo inválido'); } };
  r.readAsText(f);
}

          <td>${c.pago?R$(c.valorReal??c.val):`<input type="number" step="0.01" placeholder="${(c.val||0).toFixed(2)}" id="cv-${c.id}" style="width:90px;padding:5px">`}</td>
          <td>${c.pago?`<span class="pill" style="background:var(--c-ganho-bg);color:var(--c-ganho-t)">pago ✔</span>`:`<button class="btn p" style="padding:5px 11px;font-size:12px" onclick="pagarConta('${c.id}')">pagar</button>`}</td>
          <td style="white-space:nowrap">${c.pago?`<button class="btn s" style="padding:4px 10px;font-size:11px;margin-right:10px" onclick="despagarConta('${c.id}')" title="desfazer pagamento">↩</button>`:''}<button class="btn d" style="padding:4px 10px;font-size:11px" onclick="removerConta('${c.id}')" title="remover conta da lista">✕</button></td></tr>`;
        }).join('')}
      </table></div>
    </div>`;
  }).join('')}
  <div class="card" style="margin-bottom:14px">
    <h3><span class="dot meta"></span>Adicionar conta</h3>
    <div class="frow">
      <div><label>Nome</label><input type="text" id="nc-nome" placeholder="ex: Netflix"></div>
      <div><label>Valor estimado (R$)</label><input type="number" step="0.01" id="nc-val"></div>
      <div><label>Dia venc. (0 = livre)</label><input type="number" min="0" max="31" id="nc-dia" value="0"></div>
      <div><label>Categoria</label><select id="nc-cat">${CATS.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('')}</select></div>
      <div><label>Forma</label><select id="nc-forma"><option value="cartao">💳 Cartão</option><option value="pixqr">📱 Pix QR</option></select></div>
    </div>
    <button class="btn p" onclick="novaConta()">＋ Adicionar</button>
  </div>
  <div class="card">
    <h3><span class="dot corr"></span>Histórico de meses (${S.contas.hist.length})</h3>
    ${S.contas.hist.length?S.contas.hist.map((h,i)=>{
      const nm=(mm=>{const n=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];return n[+mm.slice(5,7)-1].toUpperCase()+'/'+mm.slice(0,4);})(h.mes);
      return `<div class="hbar"><div class="hb-top"><span><b>${nm}</b> · ${h.itens.filter(c=>c.tipo!=='meta'&&c.pago).length} contas pagas</span><span>total pago <b>${R$(h.totalPago)}</b></span></div><div class="hb-track"><div class="hb-fill" style="width:${Math.min(100,100*h.totalPago/(totalEst||1))}%;background:var(--c-custo)"></div></div></div>`;
    }).join(''):'<div class="mini">Quando o mês virar, o fechamento é arquivado aqui automaticamente — contas pagas, valores reais e total. Nada se perde.</div>'}
  </div>`;
}
function pagarConta(id){
  const c=S.contas.itens.find(x=>x.id===id); if(!c)return;
  const inp=document.getElementById('cv-'+id);
  const v=inp&&inp.value!==''?+inp.value:null;
  c.pago=true; c.valorReal=v;
  save(); render(); toast(c.nome+' paga ✔');
}
function despagarConta(id){ const c=S.contas.itens.find(x=>x.id===id); if(c){c.pago=false;c.valorReal=null;save();render();} }
function removerConta(id){
  const c=S.contas.itens.find(x=>x.id===id); if(!c)return;
  pedirConfirmacao('Remover a conta <b>'+c.nome+'</b>?<br><span class="mini">Ela sai da lista deste e dos próximos meses. O histórico de meses já fechados não muda.</span>',
    ()=>{ S.contas.itens=S.contas.itens.filter(x=>x.id!==id); save(); render(); toast(c.nome+' removida'); });
}
function novaConta(){
  const nome=document.getElementById('nc-nome').value.trim();
  const val=+document.getElementById('nc-val').value||0;
  if(!nome||!val){toast('Preencha nome e valor');return;}
  S.contas.itens.push({id:'c'+Date.now(), nome, val, dia:+document.getElementById('nc-dia').value||0,
    cat:document.getElementById('nc-cat').value, forma:document.getElementById('nc-forma').value,
    tipo: (+document.getElementById('nc-dia').value>0)?'fixa':'variavel', pago:false, valorReal:null});
  save(); render(); toast(nome+' adicionada ✔');
}
function addCompraSmoke(id){
  const c=S.contas.itens.find(x=>x.id===id); if(!c)return;
  const v=+document.getElementById('smk-v').value;
  if(!v){toast('Digite o valor da compra');return;}
  c.compras=c.compras||[]; c.compras.push({data:hoje(),valor:v});
  save(); render(); toast('Compra de '+R$(v)+' registrada');
}
function desfazerSmoke(id){
  const c=S.contas.itens.find(x=>x.id===id);
  if(c&&c.compras&&c.compras.length){c.compras.pop();save();render();}
}


/* ================= SEÇÃO: METAS ================= */
function metaAlvo(m){
  if(m.alvo!=null) return m.alvo;
  if(m.id==='m_reserva') return 6 * S.contas.itens.reduce((s,c)=>s+(c.val||0),0);
  return 0;
}
function metaGuardado(m){ return (m.aportes||[]).reduce((s,a)=>s+a.valor,0); }
function rMetas(){
  const mEl=document.getElementById('main');
  const metas=S.metas.itens;
  const totAlvo=metas.reduce((s,m)=>s+metaAlvo(m),0);
  const totGuard=metas.reduce((s,m)=>s+metaGuardado(m),0);
  const H=new Date(hoje()+'T12:00');

  mEl.innerHTML=`
  <h1>Metas pessoais</h1>
  <div class="sub">aportes manuais · aporte sugerido calculado pelo prazo · sem integração automática com o líquido</div>
  <div class="grid g3">
    <div class="kpi meta"><div class="lbl">Alvo total das metas</div><div class="val">${R$(totAlvo)}</div><div class="det">${metas.length} metas ativas</div></div>
    <div class="kpi ganho"><div class="lbl">Guardado até hoje</div><div class="val">${R$(totGuard)}</div><div class="det">${(100*totGuard/(totAlvo||1)).toFixed(1)}% do total</div></div>
    <div class="kpi liq"><div class="lbl">Falta guardar</div><div class="val">${R$(Math.max(0,totAlvo-totGuard))}</div><div class="det">somando todas as metas</div></div>
  </div>
  <div style="height:14px"></div>
  ${metas.map(mt=>{
    const alvo=metaAlvo(mt), guard=metaGuardado(mt), falta=Math.max(0,alvo-guard);
    const pct=alvo?Math.min(100,100*guard/alvo):0;
    const prazoD=new Date(mt.prazo+'T12:00');
    const diasRest=Math.max(0,Math.round((prazoD-H)/86400000));
    const semRest=Math.max(1,diasRest/7), mesRest=Math.max(1,diasRest/30.44);
    const apSem=falta/semRest, apMes=falta/mesRest;
    const concluida=falta<=0;
    const atrasada=!concluida && diasRest===0;
    return `<div class="card" style="margin-bottom:14px;border-left:4px solid var(--c-${mt.cor})">
      <h3><span class="dot ${mt.cor}"></span>${mt.nome}
        <span class="mini" style="margin-left:auto">prazo ${prazoD.toLocaleDateString('pt-BR')} · ${diasRest>0?diasRest+' dias restantes':'prazo vencido'}</span></h3>
      <div class="hbar"><div class="hb-top"><span><b>${R$(guard)}</b> de ${R$(alvo)}${mt.alvo==null?' <span class="pill" style="background:var(--c-liq-bg);color:var(--c-liq-t)">alvo dinâmico: 6× contas</span>':''}</span><span><b>${pct.toFixed(1)}%</b></span></div>
        <div class="hb-track"><div class="hb-fill" style="width:${pct}%;background:var(--c-${mt.cor})"></div></div></div>
      ${concluida?
        `<div class="insight i-pos" style="margin-top:10px"><b>Meta concluída 🎉</b>Você guardou o alvo completo.</div>`:
        `<div class="mini" style="margin:8px 0 10px">Aporte sugerido para chegar lá: <b>${R$(apSem)}/semana</b> ou <b>${R$(apMes)}/mês</b>${atrasada?' · <span class="neg">prazo vencido — ajuste o prazo ou reforce os aportes</span>':''}</div>`}
      ${mt.notas?`<div class="mini" style="margin-bottom:10px;padding:8px 10px;background:var(--surface2);border-radius:8px">${mt.notas}</div>`:''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
        <div><label>Valor do aporte (R$)</label><input type="number" step="0.01" id="ap-${mt.id}" style="width:120px"></div>
        <div style="flex:1;min-width:140px"><label>Observação (opcional)</label><input type="text" id="apobs-${mt.id}" placeholder="ex: sobra da semana"></div>
        <button class="btn p" onclick="addAporte('${mt.id}')">＋ Guardei</button>
        <button class="btn s" onclick="toggleAportes('${mt.id}')">histórico (${(mt.aportes||[]).length})</button>
        ${PLANOS[mt.id]?`<button class="btn s" style="border-color:var(--c-${mt.cor})" onclick="verPlano('${mt.id}')">📋 Plano completo</button>`:''}
        <button class="btn d" style="padding:8px 12px" onclick="removerMeta('${mt.id}')" title="remover meta">✕</button>
      </div>
      <div id="hist-${mt.id}" style="display:none;margin-top:10px">
        ${(mt.aportes||[]).length?`<div class="tbl-wrap"><table><tr><th>Data</th><th>Valor</th><th>Obs</th><th></th></tr>
          ${mt.aportes.map((a,i)=>`<tr><td>${new Date(a.data+'T12:00').toLocaleDateString('pt-BR')}</td><td class="pos">${R$(a.valor)}</td><td style="text-align:left">${a.obs||''}</td><td><button class="btn d" style="padding:3px 8px;font-size:11px" onclick="removerAporte('${mt.id}',${i})">✕</button></td></tr>`).join('')}
        </table></div>`:'<div class="mini">Nenhum aporte ainda.</div>'}
      </div>
    </div>`;
  }).join('')}
  <div class="card">
    <h3><span class="dot meta"></span>Adicionar meta</h3>
    <div class="frow">
      <div><label>Nome</label><input type="text" id="nm-nome" placeholder="ex: Notebook novo"></div>
      <div><label>Alvo (R$)</label><input type="number" step="0.01" id="nm-alvo"></div>
      <div><label>Prazo</label><input type="date" id="nm-prazo"></div>
    </div>
    <button class="btn p" onclick="novaMeta()">＋ Adicionar</button>
  </div>`;
}
function verPlano(id){
  const m=S.metas.itens.find(x=>x.id===id); const conteudo=PLANOS[id];
  if(!conteudo) return;
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal grande"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><h3 style="font-size:16px;margin:0">${m?m.nome:''} — plano completo</h3><button class="btn s" style="margin-left:auto;padding:6px 12px" id="md-x">✕ fechar</button></div><div class="m-body">${conteudo}</div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#md-x').onclick=()=>bg.remove();
  bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
}
function addAporte(id){
  const m=S.metas.itens.find(x=>x.id===id); if(!m)return;
  const v=+document.getElementById('ap-'+id).value;
  if(!v){toast('Digite o valor');return;}
  m.aportes=m.aportes||[];
  m.aportes.push({data:hoje(),valor:v,obs:document.getElementById('apobs-'+id).value.trim()});
  save(); render(); toast(R$(v)+' guardado em '+m.nome+' ✔');
}
function removerAporte(id,i){
  const m=S.metas.itens.find(x=>x.id===id); if(!m)return;
  pedirConfirmacao('Remover o aporte de <b>'+R$(m.aportes[i].valor)+'</b> de '+new Date(m.aportes[i].data+'T12:00').toLocaleDateString('pt-BR')+'?',
    ()=>{ m.aportes.splice(i,1); save(); render(); });
}
function toggleAportes(id){
  const el=document.getElementById('hist-'+id);
  el.style.display = el.style.display==='none'?'':'none';
}
function removerMeta(id){
  const m=S.metas.itens.find(x=>x.id===id); if(!m)return;
  pedirConfirmacao('Remover a meta <b>'+m.nome+'</b>?<br><span class="mini">O histórico de aportes dela será perdido.</span>',
    ()=>{ S.metas.itens=S.metas.itens.filter(x=>x.id!==id); save(); render(); toast(m.nome+' removida'); });
}
function novaMeta(){
  const nome=document.getElementById('nm-nome').value.trim();
  const alvo=+document.getElementById('nm-alvo').value||0;
  const prazo=document.getElementById('nm-prazo').value;
  if(!nome||!alvo||!prazo){toast('Preencha nome, alvo e prazo');return;}
  S.metas.itens.push({id:'m'+Date.now(),nome,alvo,prazo,cor:'corr',aportes:[],notas:''});
  save(); render(); toast(nome+' adicionada ✔');
}

/* ================= INIT ================= */
document.documentElement.dataset.theme=S.config.tema||'farol';
render();
</script>
</body>
</html>
