<!DOCTYPE html>
<html lang="pt-BR" data-theme="escuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Victor Mioto</title>
<style>
/* ============================================================
   PAINEL VICTOR MIOTO · v2 · Julho/2026
   3 paletas: farol (escura) · sol (clara quente) · pista (clara fria)
   Cores semânticas por tipo de informação:
   --c-ganho (ganhos) · --c-custo (gastos) · --c-liq (líquido)
   --c-meta (metas) · --c-corr (corridas/km) · --c-alerta
   ============================================================ */
:root{
  --radius:16px; --radius-sm:10px;
  --font-num:'Segoe UI', system-ui, sans-serif;
}
[data-theme="escuro"]{
  --bg:#0a0a0c; --bg2:#101014; --surface:#141417; --surface2:#1c1c21;
  --txt:#f2f2f4; --txt2:#9a9aa6; --border:#28282f;
  --c-ganho:#4ade80; --c-ganho-bg:#10231a; --c-ganho-t:#a7f3c4;
  --c-custo:#f5b942; --c-custo-bg:#26200e; --c-custo-t:#fde68a;
  --c-liq:#45b8f5; --c-liq-bg:#0e2230; --c-liq-t:#bae6fd;
  --c-meta:#a78bfa; --c-meta-bg:#1f1a30; --c-meta-t:#ddd6fe;
  --c-corr:#38d0e0; --c-corr-bg:#0e2529; --c-corr-t:#a5f3fc;
  --c-alerta:#f87171; --c-alerta-bg:#2a1416; --c-alerta-t:#fecdd3;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
[data-theme="claro"]{
  --bg:#f6f6f7; --bg2:#efeff1; --surface:#ffffff; --surface2:#f0f0f2;
  --txt:#191920; --txt2:#5f5f6b; --border:#e4e4e9;
  --c-ganho:#0f9d4f; --c-ganho-bg:#e2f6ea; --c-ganho-t:#0a6b36;
  --c-custo:#c07a00; --c-custo-bg:#faf0da; --c-custo-t:#8a5800;
  --c-liq:#0b7fc9; --c-liq-bg:#e0f0fa; --c-liq-t:#085a8f;
  --c-meta:#7c3aed; --c-meta-bg:#efe7fd; --c-meta-t:#5b21b6;
  --c-corr:#0d94a8; --c-corr-bg:#dcf3f6; --c-corr-t:#0a6b78;
  --c-alerta:#dc2f45; --c-alerta-bg:#fbe3e7; --c-alerta-t:#a3122d;
  --shadow:0 1px 3px rgba(20,20,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  min-height:100vh; font-size:15px; transition:background .25s,color .25s;
}
/* ---------- LAYOUT: sidebar + conteúdo ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:216px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);
  padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;
}
.logo{padding:4px 10px 18px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.logo small{display:block;font-weight:500;font-size:11px;color:var(--txt2);letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
.nav-btn{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:none;border-radius:var(--radius-sm);
  background:transparent;color:var(--txt2);font-size:14px;font-weight:600;cursor:pointer;text-align:left;transition:.15s;
}
.nav-btn:hover{background:var(--surface);color:var(--txt)}
.nav-btn.on{background:var(--surface);color:var(--txt);box-shadow:var(--shadow)}
.nav-btn .ico{font-size:17px;width:22px;text-align:center}
.nav-btn .soon{margin-left:auto;font-size:9px;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--txt2);padding:2px 6px;border-radius:20px;letter-spacing:.4px}
.sidebar .foot{margin-top:auto;padding:10px;font-size:11px;color:var(--txt2)}
main{flex:1;padding:26px clamp(14px,3vw,36px);max-width:1180px;width:100%;margin:0 auto}
h1{font-size:22px;letter-spacing:-.4px;margin-bottom:2px}
.sub{color:var(--txt2);font-size:13px;margin-bottom:20px}
/* ---------- SUB-ABAS ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:8px 14px;border-radius:24px;border:1px solid var(--border);background:var(--surface);color:var(--txt2);font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.tab.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
/* ---------- CARDS ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi{border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border:1px solid transparent}
.kpi .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;opacity:.85}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .det{font-size:12px;opacity:.8}
.kpi{background:var(--surface);border:1px solid var(--border);border-left-width:3px}
.kpi .lbl{color:var(--txt2)} .kpi .det{color:var(--txt2)}
.kpi.ganho{border-left-color:var(--c-ganho)} .kpi.ganho .val{color:var(--c-ganho)}
.kpi.custo{border-left-color:var(--c-custo)} .kpi.custo .val{color:var(--c-custo)}
.kpi.liq{border-left-color:var(--c-liq)} .kpi.liq .val{color:var(--c-liq)}
.kpi.meta{border-left-color:var(--c-meta)} .kpi.meta .val{color:var(--c-meta)}
.kpi.corr{border-left-color:var(--c-corr)} .kpi.corr .val{color:var(--c-corr)}
.kpi.alerta{border-left-color:var(--c-alerta)} .kpi.alerta .val{color:var(--c-alerta)}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.ganho{background:var(--c-ganho)} .dot.custo{background:var(--c-custo)} .dot.liq{background:var(--c-liq)}
.dot.meta{background:var(--c-meta)} .dot.corr{background:var(--c-corr)} .dot.alerta{background:var(--c-alerta)}
/* ---------- FORM ---------- */
label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);display:block;margin-bottom:4px}
input,textarea,select{
  width:100%;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--surface2);color:var(--txt);font-size:14px;font-family:inherit;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--c-liq);outline-offset:0}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.btn{padding:10px 18px;border:none;border-radius:var(--radius-sm);font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.btn.p{background:var(--c-ganho);color:#fff}
.btn.s{background:var(--surface2);color:var(--txt);border:1px solid var(--border)}
.btn.d{background:var(--c-alerta);color:#fff}
.btn:hover{filter:brightness(1.08)}
/* ---------- TABELA ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);text-align:right;padding:7px 8px;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface2)}
.pos{color:var(--c-ganho);font-weight:600} .neg{color:var(--c-alerta);font-weight:600}
.tbl-wrap{overflow-x:auto}
/* ---------- BARRAS ---------- */
.bars{display:flex;align-items:stretch;gap:4px;height:170px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;height:100%}
.bar .bwrap{flex:1;width:100%;display:flex;align-items:flex-end}
.bar .b{width:100%;border-radius:5px 5px 0 0;min-height:3px;transition:.3s}
.bar .t{font-size:9px;color:var(--txt2);white-space:nowrap;height:14px;margin-top:4px;overflow:visible}
/* --- hero do salário --- */
.hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;display:grid;grid-template-columns:1fr auto;gap:22px;align-items:start;margin-bottom:14px}
.hero .eyebrow{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--txt2)}
.hero .big{font-size:clamp(30px,6vw,42px);font-weight:800;letter-spacing:-1.2px;line-height:1.05;margin:5px 0 3px;color:var(--c-ganho);font-variant-numeric:tabular-nums}
.hero .apos{font-size:13px;color:var(--txt2)} .hero .apos b{color:var(--txt);font-weight:700}
.hero .track{position:relative;height:7px;background:var(--surface2);border-radius:6px;margin-top:15px;max-width:540px}
.hero .track .fill{position:absolute;inset:0 auto 0 0;background:var(--c-ganho);border-radius:6px}
.hero .track .pace{position:absolute;top:-3px;width:2px;height:13px;background:var(--txt2);border-radius:2px}
.hero .leg{display:flex;justify-content:space-between;font-size:11px;color:var(--txt2);margin-top:7px;max-width:540px;font-variant-numeric:tabular-nums}
.hero .ano{border-left:1px solid var(--border);padding-left:22px;min-width:158px}
.hero .ano .v{font-size:20px;font-weight:800;letter-spacing:-.4px;margin:3px 0 1px;color:var(--c-liq);font-variant-numeric:tabular-nums}
.insights-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:14px}
.ins{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--c-liq);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 15px;display:flex;gap:11px;align-items:flex-start}
.ins.pos{border-left-color:var(--c-ganho)} .ins.gas{border-left-color:var(--c-custo)} .ins.alerta{border-left-color:var(--c-alerta)} .ins.meta{border-left-color:var(--c-meta)}
.ins .ic{font-size:17px;line-height:1.3}
.ins b{display:block;font-size:12.5px;margin-bottom:2px;letter-spacing:-.1px;color:var(--txt)}
.ins span{font-size:11.5px;color:var(--txt2);line-height:1.45}
.ins .num{font-variant-numeric:tabular-nums;color:var(--txt);font-weight:600}
@media(max-width:640px){.hero{grid-template-columns:1fr}.hero .ano{border-left:none;border-top:1px solid var(--border);padding-left:0;padding-top:14px}}
.hbar{margin-bottom:9px}
.hbar .hb-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.hbar .hb-track{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}
.hbar .hb-fill{height:100%;border-radius:6px}
/* ---------- BADGES / INSIGHTS ---------- */
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.insight{border-left:4px solid;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;background:var(--surface2);font-size:13.5px;line-height:1.5}
.insight b{display:block;margin-bottom:2px}
.insight.i-pos{border-color:var(--c-ganho)} .insight.i-neg{border-color:var(--c-alerta)}
.insight.i-dica{border-color:var(--c-liq)} .insight.i-neutro{border-color:var(--c-meta)}
.mini{font-size:12px;color:var(--txt2)}
.sep{height:1px;background:var(--border);margin:14px 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;max-width:360px;width:100%;box-shadow:var(--shadow)}
.modal .m-msg{font-size:14px;line-height:1.5;margin-bottom:16px}
.modal .m-btns{display:flex;gap:8px;justify-content:flex-end}
.modal.grande{max-width:700px;max-height:86vh;display:flex;flex-direction:column}
.modal.grande .m-body{overflow-y:auto;padding-right:8px}
.modal.grande .m-body h3{font-size:14px}
.modal.grande .m-body table{margin-bottom:6px;font-size:12.5px}
/* --- registro v3 --- */
.mesnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.mescard{display:flex;align-items:center;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:26px;padding:3px}
.seta{width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--txt2);font-size:17px;cursor:pointer;line-height:1}
.seta:hover:not([disabled]){background:var(--surface);color:var(--txt)}
.seta[disabled]{opacity:.25;cursor:default}
.meslabel{min-width:148px;text-align:center;font-weight:800;font-size:14px;letter-spacing:-.2px}
.meslabel small{display:block;font-weight:500;font-size:10.5px;color:var(--txt2);font-variant-numeric:tabular-nums}
.reg-tbl{font-size:12px}
.reg-tbl th{font-size:9.5px;padding:6px 6px;white-space:nowrap}
.reg-tbl td{padding:6.5px 6px;white-space:nowrap}
.reg-tbl td.reg{font-weight:700;color:var(--txt)}
.reg-tbl td.der{color:var(--txt2)}
.reg-tbl td.liq{color:var(--c-liq);font-weight:700}
.reg-tbl td.nota{max-width:150px;overflow:hidden;text-overflow:ellipsis;text-align:left;color:var(--txt2);font-size:11px}
.reg-tbl tr.sub td{background:var(--surface2);font-weight:700;border-bottom:none;padding:9px 6px}
.reg-tbl tr.sub td span{color:var(--txt2);font-weight:500}
.reg-acts{display:flex;gap:4px;justify-content:flex-end}
.iconbtn{background:none;border:1px solid var(--border);border-radius:7px;color:var(--txt2);cursor:pointer;padding:3px 8px;font-size:11px}
.iconbtn:hover{color:var(--txt);border-color:var(--txt2)}
.iconbtn.del:hover{color:var(--c-alerta);border-color:var(--c-alerta)}
/* modal de registro */
.modal.registro{max-width:540px;text-align:left}
.modal.registro .rtitulo{font-size:16px;font-weight:800;letter-spacing:-.3px}
.modal.registro .rquando{font-size:12px;color:var(--txt2);margin:2px 0 16px;text-transform:capitalize}
.rf2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.rf2 label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--txt2);display:block;margin-bottom:4px}
.rf2 input{width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--txt);font-size:15px}
.rf2 input:focus{outline:2px solid var(--c-liq);outline-offset:0}
.rmais{display:none;border-top:1px dashed var(--border);padding-top:12px;margin-top:2px}
.rmais.on{display:block}
.rlink{background:none;border:none;color:var(--c-liq);font-weight:700;font-size:12.5px;cursor:pointer;padding:5px 0;margin-bottom:6px}
.rprev{background:var(--c-liq-bg);color:var(--c-liq-t);border:1px solid var(--c-liq);border-radius:9px;padding:9px 13px;font-size:12.5px;font-weight:600;margin:12px 0;font-variant-numeric:tabular-nums;display:flex;gap:16px;flex-wrap:wrap}
.racts{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 20px;border-radius:24px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
.toast.show{opacity:1}
.placeholder{padding:60px 20px;text-align:center;color:var(--txt2)}
.placeholder .big{font-size:40px;margin-bottom:12px}
/* ---------- MOBILE: sidebar vira barra inferior ---------- */
@media(max-width:768px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:fixed;bottom:0;top:auto;left:0;flex-direction:row;padding:6px 8px;z-index:50;border-right:none;border-top:1px solid var(--border);justify-content:space-around}
  .logo,.sidebar .foot{display:none}
  .nav-btn{flex-direction:column;gap:2px;padding:7px 4px;font-size:10px;align-items:center;flex:1}
  .nav-btn .soon{display:none}
  main{padding-bottom:90px}
  .kpi .val{font-size:22px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="logo">Painel Victor Mioto<small>Motorista · Zona Leste SP</small></div>
    <button class="nav-btn on" data-sec="desempenho"><span class="ico">🚗</span>Desempenho</button>
    <button class="nav-btn" data-sec="metas"><span class="ico">🎯</span>Metas</button>
    <button class="nav-btn" data-sec="contas"><span class="ico">💳</span>Contas</button>
    <button class="nav-btn" data-sec="estudos"><span class="ico">📚</span>Estudos</button>
    <div class="foot">v3.2 · dados Uber<br>05/01 → 03/08/2026</div>
  </nav>
  <main id="main"></main>
</div>

const R$ = v => (v==null||isNaN(v))?'–':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const N1 = v => (v==null||isNaN(v))?'–':Number(v).toLocaleString('pt-BR',{maximumFractionDigits:1});
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* horas: interno sempre DECIMAL (8.2167 = 8h13); entrada e exibição sempre RELÓGIO (8:13) */
const fmtH = h => { if(h==null||isNaN(h)) return '–'; let hh=Math.floor(h), mm=Math.round((h-hh)*60); if(mm===60){hh++;mm=0;} return hh+':'+String(mm).padStart(2,'0'); };
function parseHoras(str){
  const s=String(str??'').trim(); if(!s) return null;
  const m=s.match(/^(\d{1,2})[:.,](\d{1,2})$/);
  if(m){ const hh=+m[1], mm=+m[2]; if(mm<=59) return Math.round((hh+mm/60)*10000)/10000; }
  const v=+s.replace(',','.'); return isNaN(v)?null:v;
}
function migrarHorasRelogio(dias){ /* dias digitados à mão (pós 08/07) estavam em hh.mm de relógio */
  for(const [d,v] of Object.entries(dias||{})){
    if(d>'2026-07-08' && v.horas!=null){
      const hh=Math.floor(v.horas), mm=Math.round((v.horas-hh)*100);
      if(mm<=59) v.horas=Math.round((hh+mm/60)*10000)/10000;
    }
  }
}

const fmtDL = d => { const dt=new Date(d+'T12:00'); return dt.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}); };
function segundaDe(dstr){ const d=new Date(dstr+'T12:00'); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return dataLocal(d); }
function custoKm(){ return S.config.gas / S.config.consumo; }
function tercasMes(m, ateHoje){
  const [a,mm]=m.split('-').map(Number); const dt=new Date(a,mm-1,1); let n=0;
  const lim = ateHoje && m===hoje().slice(0,7) ? new Date(hoje()+'T12:00') : null;
  while(dt.getMonth()===mm-1){ if(dt.getDay()===2 && (!lim||dt<=lim)) n++; dt.setDate(dt.getDate()+1); }
  return n;
}
function diaCalc(d,v){
  const bruto = v.bruto||0, km = v.km||0;
  const gasto = km * custoKm();
  return { bruto, km, gasto, liq: bruto-gasto,
    rkm: km? bruto/km : null, rh: v.horas? bruto/v.horas : null,
    porFora: (v.dinFisico||0)+(v.pixPJ||0) };
}
function toneRkm(r){ return r==null?'':(r>=3.5?'pos':(r<3?'neg':'')); }

/* consumo real (km/l) a partir dos últimos 90 dias com abastecimento pago */
function consumoReal(){
  let km=0, litros=0;
  const hoje90 = (()=>{ const d=new Date(hoje()+'T12:00'); d.setDate(d.getDate()-90); return dataLocal(d); })();
  for(const [d,v] of Object.entries(S.dias)){
    if(d<hoje90 || d>hoje()) continue;
    if(v.km) km+=v.km;
    if(v.gas){ const preco=precoGasEm(d); litros += v.gas/preco; }
  }
  return (km>0 && litros>0) ? km/litros : null;
}
function precoGasEm(data){
  const h=(S.config.gasHist||[]).filter(g=>g.data<=data).sort((a,b)=>a.data<b.data?1:-1);
  return h.length ? h[0].preco : S.config.gas;
}
/* custo/km efetivo: usa consumo real se houver, senão o configurado */
function custoKmReal(){ const c=consumoReal(); return S.config.gas / (c||S.config.consumo); }

/* média de bruto por dia da semana (0=dom..6=sáb), a partir de TODO o histórico */
function mediaBrutoPorDiaSemana(){
  const soma={}, cnt={};
  for(const [d,v] of Object.entries(S.dias)){
    if(v.bruto==null) continue;
    const w=new Date(d+'T12:00').getDay();
    soma[w]=(soma[w]||0)+v.bruto; cnt[w]=(cnt[w]||0)+1;
  }
  const med={};
  for(let w=0;w<=6;w++) med[w]=cnt[w]?soma[w]/cnt[w]:0;
  return {med, cnt};
}

/* líquido operacional do ano: bruto registrado − gasolina paga − aluguéis (terças) ocorridos */
function liquidoAno(){
  const ano=hoje().slice(0,4);
  let bruto=0, gas=0;
  for(const [d,v] of Object.entries(S.dias)){
    if(d.slice(0,4)!==ano || d>hoje()) continue;
    bruto+=v.bruto||0; gas+=v.gas||0;
  }
  // terças de 05/01 (ou 1º dia) até hoje
  let tercas=0;
  const ini=new Date(ano+'-01-01T12:00'), fim=new Date(hoje()+'T12:00');
  for(let dt=new Date(ini); dt<=fim; dt.setDate(dt.getDate()+1)) if(dt.getDay()===2) tercas++;
  return { bruto, gas, aluguel:tercas*S.config.aluguel, tercas, liq: bruto-gas-tercas*S.config.aluguel };
}

/* MOTOR DE INSIGHTS: avalia regras contra o histórico e devolve as mais relevantes */
function gerarInsights(ctx){
  const {sw, brutoMes, mesAtual, H, dow} = ctx;
  const nomesDia=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  const {med} = mediaBrutoPorDiaSemana();
  const out=[];
  const R=v=>R$(v), NUM=v=>'<span class="num">'+v+'</span>';

  // dias da semana já trabalhados e seus valores
  const diasSem=Object.entries(S.dias).filter(([d])=>d>=ctx.segAtual&&d<=H).sort();

  // 1) desempenho de hoje/último dia vs média daquele dia da semana
  if(diasSem.length){
    const [ud,uv]=diasSem[diasSem.length-1];
    const w=new Date(ud+'T12:00').getDay();
    const mediaW=med[w]||0;
    if(mediaW>0 && (uv.bruto||0)>0){
      const dif=100*((uv.bruto/mediaW)-1);
      if(dif>=8) out.push({p:90,cl:'pos',ic:'🔥',t:nomesDia[w].charAt(0).toUpperCase()+nomesDia[w].slice(1)+' acima da média',
        s:'Você fez '+NUM(R(uv.bruto))+' — '+Math.round(dif)+'% acima da sua média de '+nomesDia[w]+'s ('+R(mediaW)+'). Continue nesse ritmo.'});
      else if(dif<=-12) out.push({p:70,cl:'alerta',ic:'📉',t:nomesDia[w].charAt(0).toUpperCase()+nomesDia[w].slice(1)+' abaixo da média',
        s:'Fez '+NUM(R(uv.bruto))+', '+Math.round(-dif)+'% abaixo da sua média de '+nomesDia[w]+'s ('+R(mediaW)+'). Um dia mais fraco acontece.'});
    }
  }

  // 2) projeção da semana pelas médias dos dias que faltam (a partir de qua)
  if(diasSem.length>=1 && dow>=1){
    const feitos=new Set(diasSem.map(([d])=>new Date(d+'T12:00').getDay()));
    let proj=sw.bruto;
    for(let w=1;w<=6;w++) if(!feitos.has(w) && w<=(dow===0?6:dow>=1?6:6)){ /* completa até sábado */ }
    // soma médias dos dias seg..sáb ainda não trabalhados nesta semana
    for(let w=1;w<=6;w++){ if(!feitos.has(w)) proj+=med[w]||0; }
    if(diasSem.length>=2){
      out.push({p:80,cl:'',ic:'📈',t:'Semana projetada em ~'+R(proj),
        s:'Somando suas médias dos dias que faltam, a semana caminha para '+NUM(R(proj))+' brutos.'});
    }
  }

  // 3) melhor dia da semana estatístico (dica para o dia seguinte)
  let melhorW=1, melhorV=0;
  for(let w=1;w<=6;w++) if((med[w]||0)>melhorV){ melhorV=med[w]; melhorW=w; }
  if(melhorV>0 && dow!==melhorW){
    out.push({p:50,cl:'meta',ic:'🎯',t:nomesDia[melhorW].charAt(0).toUpperCase()+nomesDia[melhorW].slice(1)+' é seu dia mais forte',
      s:'Historicamente rende '+NUM(R(melhorV))+' em média — vale priorizar mais horas nesse dia.'});
  }

  // 4) consumo real vs configurado
  const cr=consumoReal();
  if(cr){
    const dif=cr-S.config.consumo;
    if(Math.abs(dif)>=0.6){
      out.push({p:55,cl:'gas',ic:'⛽',t:'Consumo real: '+cr.toFixed(1).replace('.',',')+' km/l',
        s: dif>0
          ? 'Seu Mobi roda mais que os '+S.config.consumo+' km/l configurados — custo real de '+NUM(R(custoKmReal()))+'/km, melhor do que o painel assumia.'
          : 'Está rodando abaixo dos '+S.config.consumo+' km/l configurados ('+NUM(R(custoKmReal()))+'/km). Pode ser trânsito, pneu ou filtro.'});
    }
  }

  // 5) gasolina que falta para terminar a semana (se ainda há dias e o tanque não foi enchido hoje)
  if(dow>=1 && dow<5){
    const med2=med;
    let kmFalta=0;
    const feitos=new Set(diasSem.map(([d])=>new Date(d+'T12:00').getDay()));
    // usa média de KM por dia da semana
    const kmMed=(()=>{const s={},c={};for(const [d,v] of Object.entries(S.dias)){if(!v.km)continue;const w=new Date(d+'T12:00').getDay();s[w]=(s[w]||0)+v.km;c[w]=(c[w]||0)+1;}const m={};for(let w=1;w<=6;w++)m[w]=c[w]?s[w]/c[w]:0;return m;})();
    for(let w=1;w<=6;w++) if(!feitos.has(w)) kmFalta+=kmMed[w]||0;
    const gasFalta=kmFalta*custoKmReal();
    if(gasFalta>20){
      out.push({p:40,cl:'gas',ic:'🔋',t:'~'+R(gasFalta)+' de gasolina até fechar a semana',
        s:'Estimativa pelos ~'+Math.round(kmFalta)+' km que você costuma rodar nos dias que faltam.'});
    }
  }

  // 6) meta do mês — ritmo
  const diaMes=+H.slice(8,10), diasNoMes=new Date(+mesAtual.slice(0,4),+mesAtual.slice(5,7),0).getDate();
  const pctEsper=100*diaMes/diasNoMes, pctReal=100*brutoMes/S.config.meta;
  if(brutoMes>0){
    if(pctReal>=pctEsper+5) out.push({p:60,cl:'pos',ic:'🚀',t:'Adiantado na meta do mês',
      s:'Você já fez '+NUM(pctReal.toFixed(0)+'%')+' da meta com '+diaMes+' de '+diasNoMes+' dias — acima do ritmo esperado.'});
    else if(pctReal<=pctEsper-8) out.push({p:45,cl:'',ic:'📅',t:'Um pouco atrás do ritmo da meta',
      s:'No dia '+diaMes+' o ritmo esperado seria ~'+Math.round(pctEsper)+'%; você está em '+NUM(pctReal.toFixed(0)+'%')+'. Dá para recuperar.'});
  }

  out.sort((a,b)=>b.p-a.p);
  return out.slice(0,3);
}

/* ========== 2. HELPERS ========== */

/* percentil de um array de números (p entre 0 e 1) */
function pct(arr, p){
  if(!arr.length) return null;
  const a=[...arr].sort((x,y)=>x-y);
  const i=(a.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
  return lo===hi ? a[lo] : a[lo]+(a[hi]-a[lo])*(i-lo);
}

/* estatística de um dia da semana (w: 0=dom..6=sáb) a partir dos SEUS registros.
   Ignora dias truncados (feriado, revisão, meio expediente) para a mediana não
   ser puxada para baixo por dias que não foram jornada de verdade. */
function statsDiaSemana(w, janelaDias){
  const corte=(()=>{ const d=new Date(hoje()+'T12:00'); d.setDate(d.getDate()-(janelaDias||120)); return dataLocal(d); })();
  const minimo = w===6 ? 50 : 150;
  const brutos=[], corridas=[];
  for(const [d,v] of Object.entries(S.dias)){
    if(d<corte || d>hoje()) continue;
    if(new Date(d+'T12:00').getDay()!==w) continue;
    if(!v.bruto || v.bruto<minimo) continue;
    brutos.push(v.bruto);
    if(v.corr) corridas.push(v.corr);
  }
  if(!brutos.length) return null;
  return { n:brutos.length, med:pct(brutos,.5), p25:pct(brutos,.25), p75:pct(brutos,.75),
           corr: corridas.length? Math.round(pct(corridas,.5)) : null };
}

/* custo do dia: gasolina prevista + fatia do aluguel.
   Sábado não carrega aluguel — ele já foi coberto de segunda a sexta. */
function custoDoDia(w){
  const km = kmMedioPorDiaSemana()[w] || (w===6?40:100);
  const gas = km*custoKmReal();
  const alu = w===6 ? 0 : S.config.aluguel/6;
  return { km, gas, alu, total: gas+alu };
}

/* horário em que o custo do dia costuma ser coberto, lendo a curva */
function horaDoEquilibrio(w, meta, custo){
  const f=FAIXAS.dias[w]; if(!f || !meta) return null;
  const alvo=custo/meta;
  let ant=[6.5,0];
  for(const [h,fr] of f.curva){
    if(fr>=alvo){
      const t=(alvo-ant[1])/((fr-ant[1])||1);
      return ant[0]+(h-ant[0])*t;
    }
    ant=[h,fr];
  }
  return null;
}

/* alvo das réguas semanais: a SUA mediana dos últimos 90 dias, não um número fixo */
function alvosRegua(){
  const corte=(()=>{ const d=new Date(hoje()+'T12:00'); d.setDate(d.getDate()-90); return dataLocal(d); })();
  const rkm=[], rh=[];
  for(const [d,v] of Object.entries(S.dias)){
    if(d<corte || d>hoje() || !v.bruto) continue;
    if(v.km) rkm.push(v.bruto/v.km);
    if(v.horas) rh.push(v.bruto/v.horas);
  }
  return { rkm: pct(rkm,.5), rh: pct(rh,.5), rkmBom: pct(rkm,.75), rhBom: pct(rh,.75), n:rkm.length };
}

/* comparação ao vivo: quanto você deveria ter neste horário */
function esperadoAgora(w, meta, hDec){
  const f=FAIXAS.dias[w]; if(!f||!meta) return null;
  const c=f.curva;
  if(hDec<=c[0][0]) return meta*c[0][1]*(hDec/c[0][0]);
  for(let i=0;i<c.length-1;i++){
    if(hDec>=c[i][0] && hDec<=c[i+1][0]){
      const t=(hDec-c[i][0])/(c[i+1][0]-c[i][0]);
      return meta*(c[i][1]+(c[i+1][1]-c[i][1])*t);
    }
  }
  return meta;
}

/* chamada pelo input de acompanhamento — não re-renderiza a aba inteira */
function avaliarRitmo(){
  const el=document.getElementById('ritmoOut'); if(!el) return;
  const v=parseFloat((document.getElementById('ritmoVal')||{}).value);
  if(isNaN(v)){ el.innerHTML='<span class="mini">Digite o valor que está na tela do app.</span>'; return; }
  const ag=new Date(), w=ag.getDay(), hDec=ag.getHours()+ag.getMinutes()/60;
  const st=statsDiaSemana(w); if(!st){ el.innerHTML='<span class="mini">Sem histórico para hoje.</span>'; return; }
  const esp=esperadoAgora(w, st.med, hDec);
  const cst=custoDoDia(w).total;
  const dif=v-esp, falta=Math.max(0, st.med-v);
  const cor = dif>=0 ? 'var(--c-ganho)' : (dif>=-25 ? 'var(--c-meta)' : 'var(--c-alerta)');
  el.innerHTML =
    `Às ${fmtH(hDec)} você costuma ter <b>${R$(esp)}</b>. `
    + `Você está <b style="color:${cor}">${dif>=0?'+':''}${R$(dif)}</b> em relação ao normal.<br>`
    + (falta>0 ? `Faltam <b>${R$(falta)}</b> para a meta do dia. ` : `<b style="color:var(--c-ganho)">Meta do dia batida.</b> `)
    + (v>=cst ? `<span style="color:var(--c-ganho)">Custo do dia já coberto.</span>`
              : `<span style="color:var(--c-alerta)">Faltam ${R$(cst-v)} para cobrir o custo do dia.</span>`);
}

/* ================= ABASTECIMENTO SUGERIDO ================= */
function kmMedioPorDiaSemana(){
  // média de km por dia-da-semana (1=seg..6=sáb) do histórico do usuário
  const acc={}, cnt={};
  for(const [d,v] of Object.entries(S.dias)){
    if(!v.km) continue;
    const w=new Date(d+'T12:00').getDay();
    acc[w]=(acc[w]||0)+v.km; cnt[w]=(cnt[w]||0)+1;
  }
  const med={};
  for(let w=1;w<=6;w++) med[w]=cnt[w]?acc[w]/cnt[w]:(w===6?40:100);
  return med;
}
function calcAbastecimento(alvo){
  const ckm=custoKm();
  // último abastecimento registrado
  const comGas=Object.entries(S.dias).filter(([d,v])=>(v.gas||0)>0 && d<=hoje()).sort((a,b)=>a[0]<b[0]?1:-1);
  if(!comGas.length) return null;
  const [dGas,vGas]=comGas[0];
  // km desde então (dias APÓS o abastecimento + o próprio dia se rodou depois? convenção: metade do dia do abastecimento já coberta — usamos dias após)
  let kmDesde=0, diasDesde=0;
  for(const [d,v] of Object.entries(S.dias)){
    if(d>dGas && d<=hoje() && v.km){ kmDesde+=v.km; diasDesde++; }
  }
  const repor=kmDesde*ckm;
  // projeção até o dia-alvo
  const med=kmMedioPorDiaSemana();
  const H=new Date(hoje()+'T12:00');
  const alvoDia={'sex':5,'sab':6,'ter':2,'sete':null}[alvo];
  let kmProj=0, diasProj=[], dt=new Date(H); dt.setDate(dt.getDate()+1);
  const fim=new Date(H);
  if(alvo==='sete'){ fim.setDate(fim.getDate()+7); }
  else { fim.setDate(fim.getDate()+1); while(fim.getDay()!==alvoDia) fim.setDate(fim.getDate()+1); }
  while(dt<=fim){
    const w=dt.getDay();
    if(w>=1&&w<=6){ kmProj+=med[w]; diasProj.push(dt.toLocaleDateString('pt-BR',{weekday:'short'})); }
    dt.setDate(dt.getDate()+1);
  }
  const proj=kmProj*ckm;
  const TANQUE=47*S.config.gas; // tanque de 47 L do Mobi ao preço ATUAL da gasolina
  const sugerido=Math.min(TANQUE, repor+proj);
  return {dGas, vGas:vGas.gas, kmDesde, diasDesde, repor, kmProj:Math.round(kmProj), diasProj, proj, sugerido, estourou:(repor+proj)>TANQUE, fim};
}
function setAbastAlvo(a){ S.config.abastAlvo=a; save(); render(); }

/* ================= ABA: ESTRATÉGIA (tempo real) ================= */
function rEstrategia(){
  const c=document.getElementById('tabc');
  const H=hoje(), segAtual=segundaDe(H), mesAtual=H.slice(0,7);
  const agora=new Date();
  const dow=new Date(H+'T12:00').getDay();          // 0=dom..6=sáb
  const hDec=agora.getHours()+agora.getMinutes()/60;
  const nomesDia=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];

  /* ---- semana atual ---- */
  let sw={bruto:0,km:0,gas:0,horas:0,dias:0};
  for(const [d,v] of Object.entries(S.dias)){
    if(d<segAtual||d>H) continue;
    sw.bruto+=v.bruto||0; sw.km+=v.km||0; sw.gas+=v.gas||0; sw.horas+=v.horas||0; sw.dias++;
  }
  const liqSem=sw.bruto-sw.km*custoKmReal()-S.config.aluguel;
  const metaSem=S.config.meta/4.345;
  const diasRest=Math.max(0,6-((dow+6)%7)-1);
  const ritmoDia=sw.dias?sw.bruto/sw.dias:0;
  const projSem=sw.bruto+ritmoDia*diasRest;
  const faltaMeta=Math.max(0,metaSem-sw.bruto);
  const pSem=Math.min(100,100*sw.bruto/metaSem);

  /* ---- mês atual ---- */
  let mm={bruto:0,gas:0,dias:0};
  for(const [d,v] of Object.entries(S.dias)){
    if(d.slice(0,7)!==mesAtual) continue;
    mm.bruto+=v.bruto||0; mm.gas+=v.gas||0; mm.dias++;
  }
  const alqAte=tercasMes(mesAtual,true)*S.config.aluguel;
  const alqTotal=tercasMes(mesAtual,false)*S.config.aluguel;
  const liqMesAte=mm.bruto-mm.gas-alqAte;
  const [aa,ma]=mesAtual.split('-').map(Number);
  let uteisRest=0; const fimMes=new Date(aa,ma,0);
  for(let dt=new Date(H+'T12:00');dt<=fimMes;dt.setDate(dt.getDate()+1)){
    if(dataLocal(dt)===H) continue;
    if(dt.getDay()>=1&&dt.getDay()<=6) uteisRest++;
  }
  const ritmoUtil=mm.dias?mm.bruto/mm.dias:0;
  const gasRatio=mm.bruto?mm.gas/mm.bruto:0.2;
  const projBrutoMes=mm.bruto+ritmoUtil*uteisRest*(5.5/6);
  const projLiqMes=projBrutoMes*(1-gasRatio)-alqTotal;

  /* ---- briefing de hoje ---- */
  const st=statsDiaSemana(dow);
  const cst=custoDoDia(dow);
  const f=FAIXAS.dias[dow];
  const hEq=st?horaDoEquilibrio(dow, st.med, cst.total):null;
  const al=alvosRegua();
  /* primeiro horário da curva ainda no futuro — é a linha que fica destacada */
  const proxH = f ? (f.curva.find(([h,fr])=>h>hDec && fr>0)||[null])[0] : null;

  /* réguas da semana, calibradas pela SUA mediana */
  const rkm=sw.km?sw.bruto/sw.km:null;
  const rh=sw.horas?sw.bruto/sw.horas:null;
  const barra=(rot,val,alvo,bom,fmt)=>{
    if(val==null||alvo==null) return `<div class="hbar"><div class="hb-top"><span>${rot}</span><span class="mini">sem dado suficiente</span></div></div>`;
    const cor = val>=bom?'var(--c-ganho)':(val>=alvo?'var(--c-liq)':'var(--c-alerta)');
    const txt = val>=bom?'acima do seu p75':(val>=alvo?'na sua mediana':'abaixo da sua mediana');
    return `<div class="hbar"><div class="hb-top"><span>${rot} <span class="mini">(mediana ${fmt(alvo)} · bom ${fmt(bom)})</span></span>
      <span style="color:${cor};font-weight:700">${fmt(val)} · ${txt}</span></div>
      <div class="hb-track"><div class="hb-fill" style="width:${Math.min(100,100*val/(bom*1.15))}%;background:${cor}"></div></div></div>`;
  };

  c.innerHTML=`
  <div class="grid g3">
    <div class="kpi ${pSem>=100?'ganho':pSem>=70?'liq':'alerta'}">
      <div class="lbl">Semana vs meta (${R$(metaSem)})</div>
      <div class="val">${pSem.toFixed(0)}%</div>
      <div class="det">${R$(sw.bruto)} bruto em ${sw.dias} dia(s) · ${faltaMeta>0?('faltam '+R$(faltaMeta)):'meta batida ✔'}</div>
    </div>
    <div class="kpi ${projSem>=metaSem?'ganho':'custo'}">
      <div class="lbl">Projeção da semana</div>
      <div class="val">${R$(projSem)}</div>
      <div class="det">ritmo ${R$(ritmoDia)}/dia × ${diasRest} dia(s) restante(s) · líq. parcial ${R$(liqSem)}</div>
    </div>
    <div class="kpi ${projLiqMes>=S.config.meta*0.75?'ganho':'meta'}">
      <div class="lbl">Projeção líquida do mês</div>
      <div class="val">${R$(projLiqMes)}</div>
      <div class="det">até agora: líq. ${R$(liqMesAte)} (${mm.dias} dias) · ${uteisRest} dias úteis restantes</div>
    </div>
  </div>
  <div style="height:14px"></div>

  <div class="card">
    <h3><span class="dot ganho"></span>Briefing de hoje · ${nomesDia[dow]}</h3>
    ${!st||!f ? '<div class="mini">Ainda não há registros suficientes deste dia da semana para montar o briefing.</div>' : `
    <div class="grid g3" style="margin-bottom:14px">
      <div class="kpi custo"><div class="lbl">Custo do dia</div><div class="val">${R$(cst.total)}</div>
        <div class="det">${R$(cst.alu)} de aluguel + ${R$(cst.gas)} de gasolina (${Math.round(cst.km)} km)${hEq?' · coberto ~'+fmtH(hEq):''}</div></div>
      <div class="kpi meta"><div class="lbl">Meta do dia (mediana)</div><div class="val">${R$(st.med)}</div>
        <div class="det">sobra ${R$(st.med-cst.total)} batendo a meta · ${st.n} ${nomesDia[dow]}s nos últimos 120 dias${st.corr?' · ~'+st.corr+' corridas':''}</div></div>
      <div class="kpi ganho"><div class="lbl">Dia bom (p75)</div><div class="val">${R$(st.p75)}</div>
        <div class="det">você bate isso em 1 a cada 4 ${nomesDia[dow]}s · p25 fica em ${R$(st.p25)}</div></div>
    </div>

    <div class="grid g2">
      <div>
        <div class="mini" style="margin-bottom:6px"><b>Régua de conferência</b> — compare com a tela do app, não com o painel.</div>
        <div class="tbl-wrap"><table>
          <tr><th>Até</th><th>No ritmo</th><th>Dia bom</th></tr>
          ${f.curva.filter((p,i,arr)=>p[1]>0 && (i===0||p[1]>arr[i-1][1])).map(([h,fr])=>
            `<tr style="${h===proxH?'background:rgba(240,168,48,.12);font-weight:600':(h<hDec?'opacity:.45':'')}">
              <td>${fmtH(h)}</td><td>${R$(st.med*fr)}</td><td>${R$(st.p75*fr)}</td></tr>`).join('')}
        </table></div>
      </div>
      <div>
        <div class="mini" style="margin-bottom:6px"><b>Plano da jornada</b> — R$/h em tempo de relógio.</div>
        <div class="tbl-wrap"><table>
          <tr><th>Bloco</th><th>Faixa</th><th>R$/h</th><th>Meta</th></tr>
          ${f.blocos.map(([nome,a,b,fr])=>{
            const val=st.med*fr, rhb=val/(b-a);
            const dentro = hDec>=a && hDec<b;
            if(fr<=0) return `<tr style="opacity:.45"><td>${nome}</td><td>${fmtH(a)}–${fmtH(b)}</td><td colspan="2" class="mini">sem dado — faixa a testar</td></tr>`;
            return `<tr style="${dentro?'background:rgba(240,168,48,.12);font-weight:600':(hDec>=b?'opacity:.45':'')}">
              <td>${nome}</td><td>${fmtH(a)}–${fmtH(b)}</td><td>${R$(rhb)}</td><td>${R$(val)}</td></tr>`;
          }).join('')}
        </table></div>
      </div>
    </div>

    <div class="hbar" style="margin-top:14px">
      <div class="hb-top"><span><b>Estou no ritmo?</b></span></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px">
        <input id="ritmoVal" type="number" step="0.01" inputmode="decimal" placeholder="0,00"
               oninput="avaliarRitmo()" style="max-width:150px">
        <span class="mini">valor que está na tela do app agora</span>
      </div>
      <div id="ritmoOut"><span class="mini">Digite o valor que está na tela do app.</span></div>
    </div>

    <div class="mini" style="margin-top:10px">Metas e corridas vêm dos seus registros e se atualizam sozinhas.
    A curva do dia (quanto entra em cada faixa) foi apurada nos extratos oficiais de ${FAIXAS.janela} — apuração de ${FAIXAS.apurado}.</div>
    `}
  </div>
  <div style="height:14px"></div>

  <div class="grid g2">
    <div class="card">
      <h3><span class="dot liq"></span>Réguas da semana</h3>
      ${barra('R$/km', rkm, al.rkm, al.rkmBom, v=>v.toFixed(2))}
      ${barra('R$/hora', rh, al.rh, al.rhBom, v=>v.toFixed(2))}
      <div class="hbar"><div class="hb-top"><span>Custo da semana (gasolina + aluguel)</span><span>${R$(sw.km*custoKmReal()+S.config.aluguel)}</span></div>
        <div class="hb-track"><div class="hb-fill" style="width:${sw.bruto?Math.min(100,100*(sw.km*custoKmReal()+S.config.aluguel)/sw.bruto):0}%;background:var(--c-custo)"></div></div></div>
      <div class="mini">Os alvos são a sua própria mediana e o seu p75 dos últimos 90 dias (${al.n} dias na amostra) — não números fixos. Se o seu desempenho subir, a régua sobe junto.</div>
    </div>
    <div class="card">
      <h3><span class="dot custo"></span>Abastecimento sugerido</h3>
      ${(()=>{
        const alvo=S.config.abastAlvo||'sab';
        const a=calcAbastecimento(alvo);
        if(!a) return '<div class="mini">Registre um abastecimento no campo ⛽ do Registro Diário para o cálculo começar.</div>';
        const nomes={'sex':'até sexta','sab':'até sábado','ter':'até terça (aluguel)','sete':'próximos 7 dias'};
        return `
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
          ${Object.entries(nomes).map(([k,n])=>`<button class="tab ${alvo===k?'on':''}" onclick="setAbastAlvo('${k}')">${n}</button>`).join('')}
        </div>
        <div class="hbar"><div class="hb-top"><span>1 · Repor o queimado desde ${new Date(a.dGas+'T12:00').toLocaleDateString('pt-BR')} (${R$(a.vGas)} abastecidos)</span><span><b>${R$(a.repor)}</b></span></div>
          <div class="hb-track"><div class="hb-fill" style="width:${Math.min(100,100*a.repor/a.sugerido)}%;background:var(--c-custo)"></div></div>
          <div class="mini">${a.kmDesde} km rodados em ${a.diasDesde} dia(s) × ${R$(custoKm())}/km</div></div>
        <div class="hbar"><div class="hb-top"><span>2 · Cobrir ${nomes[alvo]} (${a.diasProj.length} dia(s) de rodagem)</span><span><b>${R$(a.proj)}</b></span></div>
          <div class="hb-track"><div class="hb-fill" style="width:${Math.min(100,100*a.proj/a.sugerido)}%;background:var(--c-liq)"></div></div>
          <div class="mini">~${a.kmProj} km projetados pelo seu histórico de km por dia da semana</div></div>
        <div class="insight ${a.estourou?'i-neg':'i-pos'}" style="margin-top:10px"><b>Sugestão: abasteça ${R$(a.sugerido)}</b>${a.estourou?'A conta completa ('+R$(a.repor+a.proj)+') passa do tanque do Mobi — abasteça o tanque e complete no meio do caminho.':'Repõe o consumido e cobre a rodagem até o dia escolhido — sem dinheiro parado no tanque.'} Pague pelo Shellbox para não perder o cashback.</div>`;
      })()}
    </div>
  </div>`;
}

function rRegistro(){
  const c=document.getElementById('tabc');
  const ckm=custoKmReal();
  const meses=[...new Set(Object.keys(S.dias).map(d=>d.slice(0,7)))].sort();
  if(!meses.length){ c.innerHTML='<div class="card"><h3><span class="dot ganho"></span>Registro</h3><div class="mini">Nenhum dia ainda. Toque em “Registrar hoje”.</div><div style="margin-top:12px"><button class="btn p" onclick="abrirRegistro(null)">＋ Registrar hoje</button></div></div>'; return; }
  if(!mesReg || !meses.includes(mesReg)) mesReg = meses[meses.length-1];
  const idx=meses.indexOf(mesReg);
  const lista=Object.entries(S.dias).filter(([d])=>d.slice(0,7)===mesReg).sort((a,b)=>a[0]<b[0]?1:-1);

  // subtotais do mês
  let tb=0,tg=0,tk=0,th=0,tc=0;
  lista.forEach(([d,v])=>{tb+=v.bruto||0;tg+=v.gas||0;tk+=v.km||0;th+=v.horas||0;tc+=v.corr||0;});
  const alqMes=tercasMes(mesReg,true)*S.config.aluguel;
  const liqReal=tb-tg-alqMes;

  const linha=([d,v])=>{
    const bruto=v.bruto||0, km=v.km||0, gas=v.gas||0;
    const liq=bruto-km*ckm; // líquido operacional estimado por km
    const rkm=km?bruto/km:null, rh=v.horas?bruto/v.horas:null, tk=v.corr?bruto/v.corr:null;
    const litros=gas?(gas/precoGasEm(d)):null;
    const gasCel = gas? R$(gas)+(litros?' · '+litros.toFixed(1).replace('.',',')+' L':'') : '–';
    const nota=v.notas||'';
    return `<tr>
      <td>${fmtDL(d)}</td>
      <td class="reg">${R$(bruto)}</td>
      <td class="${gas?'reg':'der'}">${gasCel}</td>

      <td class="reg">${fmtH(v.horas)}</td>
      <td class="der">${rh?R$(rh):'–'}</td>
      <td class="reg">${v.corr??'–'}</td>
      <td class="der">${tk?R$(tk):'–'}</td>
      <td class="nota" title="${esc(nota)}">${nota?esc(nota):'–'}</td>

    </tr>`;
  };

  c.innerHTML=`
  <div class="mesnav">
    <div class="mescard">
      <button class="seta" ${idx<=0?'disabled':''} onclick="navMes(-1)">‹</button>
      <div class="meslabel">${nomeMesExt(mesReg).charAt(0).toUpperCase()+nomeMesExt(mesReg).slice(1)} ${mesReg.slice(0,4)}<small>${lista.length} dia(s) · ${R$(tb)}</small></div>
      <button class="seta" ${idx>=meses.length-1?'disabled':''} onclick="navMes(1)">›</button>
    </div>
    <div style="flex:1"></div>
    <button class="btn p" onclick="abrirRegistro(null)">＋ Registrar hoje</button>
  </div>
  <div class="card">
    <div class="tbl-wrap"><table class="reg-tbl">
      <tr><th>Data</th><th>Bruto</th><th>Gasolina</th><th>Líquido*</th><th>KM</th><th>R$/km</th><th>Horas</th><th>R$/h</th><th>Corr.</th><th>Ticket</th><th>Notas</th><th></th></tr>
      ${lista.map(linha).join('')}
      <tr class="sub">
        <td>Mês</td><td>${R$(tb)}</td><td>${R$(tg)}</td>
        <td style="color:var(--c-liq)">${R$(liqReal)} <span>real</span></td>
        <td>${N1(tk)}</td><td><span>${tk?(tb/tk).toFixed(2):'–'}</span></td>
        <td>${fmtH(th)}</td><td><span>${th?R$(tb/th):'–'}</span></td>
        <td>${tc}</td><td><span>${tc?R$(tb/tc):'–'}</span></td>
        <td class="nota"><span>${tercasMes(mesReg,true)} aluguel(éis)</span></td><td></td>
      </tr>
    </table></div>
    <div class="mini" style="margin-top:10px">*Líquido da linha = bruto − gasolina estimada do dia (km × ${R$(ckm)}/km, consumo real). No rodapé, o líquido <b style="color:var(--txt)">real</b> do mês: bruto − gasolina paga − aluguéis já ocorridos.</div>
  </div>`;
}

/* navegação entre meses */

  const meses=[...new Set(Object.keys(S.dias).map(d=>d.slice(0,7)))].sort();

/* janela de análise em dias — controlada pelos botões da aba Análises */
let janelaAnalise = 180;
function setJanela(n){ janelaAnalise = n; render(); }

/* dias registrados dentro da janela, já com os derivados calculados */
function diasDaJanela(dias){
  const corte=(()=>{ const d=new Date(hoje()+'T12:00'); d.setDate(d.getDate()-(dias||janelaAnalise)); return dataLocal(d); })();
  const out=[];
  for(const [d,v] of Object.entries(S.dias)){
    if(d<corte || d>hoje() || !v.bruto) continue;
    out.push({ d, w:new Date(d+'T12:00').getDay(), dia:+d.slice(8,10),
               bruto:v.bruto, km:v.km||null, horas:v.horas||null,
               corr:v.corr||null, promo:v.promo||0 });
  }
  return out.sort((a,b)=>a.d<b.d?-1:1);
}

/* jornada cheia = dia que não foi truncado por feriado, revisão ou meio expediente */
function jornadaCheia(x){ return x.w===6 ? x.bruto>=50 : x.bruto>=150; }

/* evolução mês a mês a partir dos SEUS registros */
function evolucaoMensal(){
  const m={};
  for(const [d,v] of Object.entries(S.dias)){
    if(!v.bruto || d>hoje()) continue;
    const k=d.slice(0,7);
    m[k]=m[k]||{dias:0,bruto:0,promo:0,km:0,kmB:0,h:0,hB:0,corr:0};
    const a=m[k];
    a.dias++; a.bruto+=v.bruto; a.promo+=v.promo||0; a.corr+=v.corr||0;
    if(v.km){ a.km+=v.km; a.kmB+=v.bruto; }
    if(v.horas){ a.h+=v.horas; a.hB+=v.bruto; }
  }
  return Object.entries(m).sort().map(([k,a])=>({
    mes:k, dias:a.dias, brutoDia:a.bruto/a.dias, exPromoDia:(a.bruto-a.promo)/a.dias,
    rkm:a.km?a.kmB/a.km:null, rh:a.h?a.hB/a.h:null,
    corrDia:a.corr/a.dias, bruto:a.bruto, promo:a.promo
  }));
}

/* efeito do dia do mês (ciclo de pagamento de salários).
   Compara cada dia com a média do seu próprio dia da semana, para que
   a distribuição de segundas/sextas dentro do mês não distorça o resultado. */
function efeitoDiaDoMes(){
  const base=diasDaJanela(365).filter(jornadaCheia).filter(x=>x.w>=1&&x.w<=5);
  if(base.length<40) return null;
  const somaW={}, cntW={};
  base.forEach(x=>{ somaW[x.w]=(somaW[x.w]||0)+x.bruto; cntW[x.w]=(cntW[x.w]||0)+1; });
  const faixas=[['1 a 7',1,7],['8 a 15',8,15],['16 a 23',16,23],['24 ao fim',24,31]];
  return { n:base.length, faixas: faixas.map(([rot,a,b])=>{
    const L=base.filter(x=>x.dia>=a&&x.dia<=b);
    if(!L.length) return {rot,n:0,med:null,desvio:null};
    const desvios=L.map(x=>x.bruto-(somaW[x.w]/cntW[x.w]));
    return { rot, n:L.length, med:pct(L.map(x=>x.bruto),.5), desvio:desvios.reduce((s,v)=>s+v,0)/desvios.length };
  })};
}

/* R$/h de relógio por faixa horária, combinando a curva dos extratos
   com a sua mediana atual de cada dia da semana */
function produtividadePorFaixa(){
  const acc={};
  for(let w=1;w<=6;w++){
    const f=FAIXAS.dias[w], st=statsDiaSemana(w);
    if(!f||!st) continue;
    f.blocos.forEach(([nome,a,b,fr])=>{
      if(fr<=0) return;
      const k=a+'-'+b;
      acc[k]=acc[k]||{a,b,nome,soma:0,peso:0};
      acc[k].soma += (st.med*fr)/(b-a) * st.n;
      acc[k].peso += st.n;
    });
  }
  return Object.values(acc).sort((x,y)=>x.a-y.a).map(x=>({...x, rh:x.soma/x.peso}));
}

/* confronto painel × extrato oficial, semana a semana */
function conferePainelExtrato(){
  return UBER.semanas.filter(w=>w.rend>0).map(w=>{
    let painel=0, dias=0;
    for(const [d,v] of Object.entries(S.dias)){
      if(d>=w.ini && d<w.fim && v.bruto){ painel+=v.bruto; dias++; }
    }
    return { ini:w.ini, fim:w.fim, extrato:w.rend, painel, dias, dif:painel-w.rend };
  });
}

function atualizaImpacto(){
  const g=+document.getElementById('cfg-gas')?.value||S.config.gas;
  const cs=+document.getElementById('cfg-consumo')?.value||S.config.consumo;
  const al=+document.getElementById('cfg-aluguel')?.value||S.config.aluguel;
  const ck=g/cs, kmSem=470;
  const el=document.getElementById('cfg-impacto'); if(!el)return;
  el.innerHTML=`<b>Impacto em tempo real:</b> custo de gasolina <b>${R$(ck)}/km</b> · numa semana típica de ${kmSem} km: gasolina <b>${R$(kmSem*ck)}</b> + aluguel <b>${R$(al)}</b> = custo fixo <b>${R$(kmSem*ck+al)}</b>/semana. Para cada R$ 0,10 no litro, sua semana muda ~${R$(kmSem*0.10/cs)}.`;
}
function salvarCfg(){
  const g=+document.getElementById('cfg-gas').value;
  if(g && g!==S.config.gas){ S.config.gasHist=S.config.gasHist||[]; S.config.gasHist.push({data:hoje(),preco:g}); }
  S.config.gas=g||S.config.gas;
  S.config.consumo=+document.getElementById('cfg-consumo').value||S.config.consumo;
  S.config.aluguel=+document.getElementById('cfg-aluguel').value||S.config.aluguel;
  S.config.meta=+document.getElementById('cfg-meta').value||S.config.meta;
  save(); toast('Parâmetros salvos ✔'); render();
}
function setTema(t){ S.config.tema=t; document.documentElement.dataset.theme=t; save(); render(); }
function exportar(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='victor-painel-v2-'+hoje()+'.json'; a.click();
}
function importar(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let obj;
    try{ obj=JSON.parse(r.result); }catch(e){ toast('Arquivo inválido'); return; }
    if(!obj || typeof obj!=='object' || Array.isArray(obj) || !obj.dias){ toast('JSON sem o campo "dias" — importação cancelada para proteger seus dados'); return; }
    const ehAntigo = Object.values(obj.dias).some(v=>'dinheiro' in v && !('dinFisico' in v));
    const nDias=Object.keys(obj.dias).length;
    pedirConfirmacao(
      'Importar <b>'+esc(f.name)+'</b>?<br><span class="mini">'+nDias+' dia(s) no arquivo · '
      +'contas: '+(obj.contas?'do arquivo':'SUBSTITUÍDAS pelo padrão')+' · metas: '+(obj.metas?'do arquivo':'SUBSTITUÍDAS pelo padrão')+' · estudos: '+(obj.estudos?'do arquivo':'SUBSTITUÍDOS pelo padrão')
      +'.<br>Um backup do estado atual será guardado antes.</span>',
      ()=>{
        try{ localStorage.setItem(KEY+'_bak', JSON.stringify(S)); }catch(e){}
        const novo = ehAntigo ? migrarAntigo(obj) : {...clone(DEF),...obj,config:{...DEF.config,...obj.config}};
        novo.dias = {...S.dias, ...novo.dias};
        novo.histDel = Array.isArray(obj.histDel) ? obj.histDel : (S.histDel||[]);
        if(!(obj.config&&obj.config.horasV3)){ migrarHorasRelogio(novo.dias); }
        novo.config.horasV3=true;
        S=novo; S.config.tema=mapTema(S.config.tema);
        save(); document.documentElement.dataset.theme=S.config.tema;
        toast(ehAntigo?'JSON antigo importado e migrado ✔':'JSON importado ✔ (backup do estado anterior guardado)'); render();
      });
  };
  r.readAsText(f);
}

    return `<div class="card" style="margin-bottom:14px;border-left:4px solid var(--c-${mt.cor})">
      <h3><span class="dot ${mt.cor}"></span>${esc(mt.nome)}
        <span class="mini" style="margin-left:auto">prazo ${prazoD.toLocaleDateString('pt-BR')} · ${diasRest>0?diasRest+' dias restantes':'prazo vencido'}</span></h3>
      <div class="hbar"><div class="hb-top"><span><b>${R$(guard)}</b> de ${R$(alvo)}${mt.alvo==null?' <span class="pill" style="background:var(--c-liq-bg);color:var(--c-liq-t)">alvo dinâmico: 6× contas</span>':''}</span><span><b>${pct.toFixed(1)}%</b></span></div>
        <div class="hb-track"><div class="hb-fill" style="width:${pct}%;background:var(--c-${mt.cor})"></div></div></div>
      ${concluida?
        `<div class="insight i-pos" style="margin-top:10px"><b>Meta concluída 🎉</b>Você guardou o alvo completo.</div>`:
        `<div class="mini" style="margin:8px 0 10px">Aporte sugerido para chegar lá: <b>${R$(apSem)}/semana</b> ou <b>${R$(apMes)}/mês</b>${atrasada?' · <span class="neg">prazo vencido — ajuste o prazo ou reforce os aportes</span>':''}</div>`}
      ${mt.notas?`<div class="mini" style="margin-bottom:10px;padding:8px 10px;background:var(--surface2);border-radius:8px">${esc(mt.notas)}</div>`:''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
        <div><label>Valor do aporte (R$)</label><input type="number" step="0.01" id="ap-${mt.id}" style="width:120px"></div>
        <div style="flex:1;min-width:140px"><label>Observação (opcional)</label><input type="text" id="apobs-${mt.id}" placeholder="ex: sobra da semana"></div>
        <button class="btn p" onclick="addAporte('${mt.id}')">＋ Guardei</button>
        <button class="btn s" onclick="toggleAportes('${mt.id}')">histórico (${(mt.aportes||[]).length})</button>
        ${PLANOS[mt.id]?`<button class="btn s" style="border-color:var(--c-${mt.cor})" onclick="verPlano('${mt.id}')">📋 Plano completo</button>`:''}
        <button class="btn d" style="padding:8px 12px" onclick="removerMeta('${mt.id}')" title="remover meta">✕</button>
      </div>
      <div id="hist-${mt.id}" style="display:none;margin-top:10px">
        ${(mt.aportes||[]).length?`<div class="tbl-wrap"><table><tr><th>Data</th><th>Valor</th><th>Obs</th><th></th></tr>
          ${mt.aportes.map((a,i)=>`<tr><td>${new Date(a.data+'T12:00').toLocaleDateString('pt-BR')}</td><td class="pos">${R$(a.valor)}</td><td style="text-align:left">${esc(a.obs||'')}</td><td><button class="btn d" style="padding:3px 8px;font-size:11px" onclick="removerAporte('${mt.id}',${i})">✕</button></td></tr>`).join('')}
        </table></div>`:'<div class="mini">Nenhum aporte ainda.</div>'}
      </div>
    </div>`;
  }).join('')}
  <div class="card">
    <h3><span class="dot meta"></span>Adicionar meta</h3>
    <div class="frow">
      <div><label>Nome</label><input type="text" id="nm-nome" placeholder="ex: Notebook novo"></div>
      <div><label>Alvo (R$)</label><input type="number" step="0.01" id="nm-alvo"></div>
      <div><label>Prazo</label><input type="date" id="nm-prazo"></div>
    </div>
    <button class="btn p" onclick="novaMeta()">＋ Adicionar</button>
  </div>`;
}
function verPlano(id){
  const m=S.metas.itens.find(x=>x.id===id); const conteudo=PLANOS[id];
  if(!conteudo) return;
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal grande"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><h3 style="font-size:16px;margin:0">${m?esc(m.nome):''} — plano completo</h3><button class="btn s" style="margin-left:auto;padding:6px 12px" id="md-x">✕ fechar</button></div><div class="m-body">${conteudo}</div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#md-x').onclick=()=>bg.remove();
  bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
}
function addAporte(id){
  const m=S.metas.itens.find(x=>x.id===id); if(!m)return;
  const v=+document.getElementById('ap-'+id).value;
  if(!v){toast('Digite o valor');return;}
  m.aportes=m.aportes||[];
  m.aportes.push({data:hoje(),valor:v,obs:document.getElementById('apobs-'+id).value.trim()});
  save(); render(); toast(R$(v)+' guardado em '+m.nome+' ✔');
}
function removerAporte(id,i){
  const m=S.metas.itens.find(x=>x.id===id); if(!m)return;
  pedirConfirmacao('Remover o aporte de <b>'+R$(m.aportes[i].valor)+'</b> de '+new Date(m.aportes[i].data+'T12:00').toLocaleDateString('pt-BR')+'?',
    ()=>{ m.aportes.splice(i,1); save(); render(); });
}
function toggleAportes(id){
  const el=document.getElementById('hist-'+id);
  el.style.display = el.style.display==='none'?'':'none';
}
function removerMeta(id){
  const m=S.metas.itens.find(x=>x.id===id); if(!m)return;
  pedirConfirmacao('Remover a meta <b>'+esc(m.nome)+'</b>?<br><span class="mini">O histórico de aportes dela será perdido.</span>',
    ()=>{ S.metas.itens=S.metas.itens.filter(x=>x.id!==id); save(); render(); toast(m.nome+' removida'); });
}
function novaMeta(){
  const nome=document.getElementById('nm-nome').value.trim();
  const alvo=+document.getElementById('nm-alvo').value||0;
  const prazo=document.getElementById('nm-prazo').value;
  if(!nome||!alvo||!prazo){toast('Preencha nome, alvo e prazo');return;}
  S.metas.itens.push({id:'m'+Date.now(),nome,alvo,prazo,cor:'corr',aportes:[],notas:''});
  save(); render(); toast(nome+' adicionada ✔');
}


/* ================= SEÇÃO: ESTUDOS ================= */
function rEstudos(){
  const mEl=document.getElementById('main');
  const totalSem=TRILHA.reduce((s,f)=>s+f.sem.length,0);
  const feitas=Object.keys(S.estudos.done).length;
  const pct=100*feitas/totalSem;
  // semana esperada pelo calendário (início 01/07/2026)
  const ini=new Date('2026-07-01T12:00'), H=new Date(hoje()+'T12:00');
  const semEsp=Math.min(totalSem, Math.max(1, Math.floor((H-ini)/(7*86400000))+1));
  const ritmo = feitas>=semEsp ? ['no ritmo ✔','ganho'] : [`${semEsp-feitas} semana(s) atrás do calendário`,'custo'];
  // fase atual = primeira com semana pendente
  let faseAtual=TRILHA[TRILHA.length-1], proxSemana=null, proxIdx=0;
  outer: for(const f of TRILHA){
    for(let i=0;i<f.sem.length;i++){
      if(!S.estudos.done[f.id+'-'+i]){ faseAtual=f; proxSemana=f.sem[i]; proxIdx=i; break outer; }
    }
  }
  mEl.innerHTML=`
  <h1>Planejamento de estudos</h1>
  <div class="sub">trilha dev 2026/27 · 43 semanas · 1h30 por dia útil · jul/2026 → abr/2027 · revisada jul/2026 contra vagas reais</div>
  <div class="grid g3">
    <div class="kpi meta"><div class="lbl">Progresso da trilha</div><div class="val">${feitas}/${totalSem}</div><div class="det">${pct.toFixed(1)}% das semanas concluídas</div></div>
    <div class="kpi ${ritmo[1]}"><div class="lbl">Ritmo vs calendário</div><div class="val">${feitas>=semEsp?'OK':semEsp-feitas}</div><div class="det">semana esperada: ${semEsp} · ${ritmo[0]}</div></div>
    <div class="kpi liq"><div class="lbl">Agora: ${faseAtual.nome.split('—')[0].trim()}</div><div class="val" style="font-size:15px;line-height:1.35">${proxSemana?('Semana '+(proxIdx+1)+': '+proxSemana):'Trilha concluída 🎉'}</div><div class="det">${proxSemana?'próxima semana a concluir':''}</div></div>
  </div>
  <div style="height:6px"></div>
  <div class="hbar"><div class="hb-track" style="height:12px"><div class="hb-fill" style="width:${pct}%;background:var(--c-meta)"></div></div></div>
  <div style="height:10px"></div>
  ${TRILHA.map(f=>{
    const done=f.sem.filter((_,i)=>S.estudos.done[f.id+'-'+i]).length;
    const aberta=S.estudos.fasesAbertas.includes(f.id);
    const completa=done===f.sem.length;
    return `<div class="card" style="margin-bottom:12px;border-left:4px solid var(--c-${f.cor})">
      <h3 style="cursor:pointer;user-select:none" onclick="toggleFase('${f.id}')">
        <span class="dot ${f.cor}"></span>${f.nome}
        <span class="pill" style="margin-left:8px;background:${completa?'var(--c-ganho-bg)':'var(--surface2)'};color:${completa?'var(--c-ganho-t)':'var(--txt2)'}">${done}/${f.sem.length}${completa?' ✔':''}</span>
        <span class="mini" style="margin-left:auto">${f.per} ${aberta?'▴':'▾'}</span>
      </h3>
      <div style="display:${aberta?'block':'none'}">
        <div class="mini" style="margin-bottom:10px">${f.desc}</div>
        ${f.sem.map((s,i)=>{
          const k=f.id+'-'+i, d=S.estudos.done[k];
          return `<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border-bottom:1px solid var(--border);${d?'opacity:.65':''}">
            <input type="checkbox" ${d?'checked':''} onchange="toggleSemana('${k}')" style="width:18px;height:18px;margin-top:1px;flex-shrink:0;cursor:pointer">
            <div style="flex:1"><b style="font-size:13px">Semana ${i+1}</b> <span style="font-size:13px">· ${s}</span>
            ${d?`<div class="mini">concluída em ${new Date(d+'T12:00').toLocaleDateString('pt-BR')}</div>`:''}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('')}
  <div class="card">
    <h3><span class="dot ganho"></span>Estratégia de mercado 2027 (revisada jul/2026 com dados de vagas reais)</h3>
    <div class="insight i-pos"><b>A semana 1 você já viveu</b>Repositório, commit, push, branch, pull request e merge — tudo executado de verdade neste painel (4 PRs mergeados no Painel-Geral). Git aparece em ~100% das vagas júnior, e você já pratica o fluxo completo.</div>
    <div class="insight i-dica"><b>Regra de ouro da IA (a partir da fase 2)</b>Uso inteligente de IA virou requisito, não diferencial: as empresas querem quem usa IA para revisar código, gerar testes e aprender mais rápido — sabendo validar o que ela entrega. Use nos exercícios, mas só aceite código que você explica linha a linha. Sem essa regra, a IA faz o exercício e você não aprende.</div>
    <div class="insight i-dica"><b>Construa em público desde a fase 2</b>O funil até a 1ª vaga leva 6–12 meses e a concorrência é de 200–500 candidatos por vaga. GitHub ativo + 1 post curto por semana (LinkedIn/TabNews) mostrando o progresso do painel constroem sua presença ANTES de você precisar dela.</div>
    <div class="insight i-neg"><b>Candidaturas começam em dez/jan (fase 4), não em fevereiro</b>Trate as primeiras entrevistas como treino. Estágios e programas de entrada (Software Engineer I) também contam — as portas de entrada pedem base em APIs, SQL e Git, que você terá ao fim da fase 3.</div>
    <div class="insight i-pos"><b>Seu diferencial: este painel</b>Numa fila de 300 clones de Netflix, você tem um sistema real com dados reais que guia suas decisões de trabalho há meses — e inglês fluente, que a maioria dos júniors não tem. A história "motorista que construiu seu painel de gestão e virou dev" é o que faz recrutador parar de rolar a tela. O README da fase 5 é onde ela ganha forma.</div>
  </div>`;
}
function toggleFase(id){
  const a=S.estudos.fasesAbertas;
  const i=a.indexOf(id);
  if(i>=0) a.splice(i,1); else a.push(id);
  save(); render();
}
function toggleSemana(k){
  if(S.estudos.done[k]) delete S.estudos.done[k];
  else S.estudos.done[k]=hoje();
  save(); render();
  const n=Object.keys(S.estudos.done).length;
  const tot=TRILHA.reduce((s,f)=>s+f.sem.length,0);
  if(S.estudos.done[k]) toast('Semana concluída ✔ ('+n+'/'+tot+')');
}

/* ================= INIT ================= */
/* migração v3: temas antigos → escuro/claro */
const mapTema = t => t==='farol' ? 'escuro' : (t==='sol'||t==='pista') ? 'claro' : (t||'escuro');
if(S.config.tema !== mapTema(S.config.tema)){ S.config.tema = mapTema(S.config.tema); save(); }
S.config.tema = S.config.tema || 'escuro';
/* migração v3: horas digitadas como relógio (pós 08/07) → decimal interno */
if(!S.config.horasV3){ migrarHorasRelogio(S.dias); S.config.horasV3 = true; save(); }
document.documentElement.dataset.theme=S.config.tema;
render();
</script>
</body>
